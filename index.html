<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6c63ff">
<link rel="manifest" href="manifest.webmanifest">
<title>プロセカ ガチャ禁管理</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6fb;color:#202124;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
header{background:linear-gradient(135deg,#6c63ff,#8d7cff);color:#fff;padding:22px 16px}
header h1{margin:0;font-size:24px}
header p{margin:6px 0 0;opacity:.9;font-size:13px}
.wrap{max-width:980px;margin:auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #0000000d}
.card h2{font-size:18px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field label{display:block;font-size:12px;font-weight:700;margin:0 0 5px;color:#666}
.field input,.field select{width:100%;padding:10px;border:1px solid #d9d9e3;border-radius:10px;background:#fff;font:inherit}
.btn{border:0;border-radius:10px;padding:10px 14px;background:#6c63ff;color:#fff;font-weight:700;cursor:pointer}
.btn.sub{background:#eeeef5;color:#333}
.btn.danger{background:#ffe8ec;color:#b4233c}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.target{border:1px solid #e2e2eb;border-radius:14px;padding:14px;margin:10px 0}
.targetHead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.targetHead strong{font-size:16px}
.summaryBox{border:1px solid #e3e2f4;background:#faf9ff;border-radius:14px;padding:14px;margin:10px 0}
.summaryTitle{font-weight:800;margin-bottom:10px}
.summaryGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.summaryGrid>div{background:#fff;border-radius:10px;padding:9px}
.summaryGrid span{display:block;font-size:11px;color:#777}
.summaryGrid b{display:block;margin-top:3px;font-size:15px}
.progress{height:9px;background:#e9e9f1;border-radius:99px;overflow:hidden;margin-top:10px}
.bar{height:100%;background:#6c63ff}
.photoGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px}
.photoItem{position:relative;border-radius:10px;overflow:hidden;background:#f0f0f5;min-height:90px;display:flex;align-items:center;justify-content:center}
.photoItem img{display:block;width:100%;max-height:240px;object-fit:contain}
.photoItem button{position:absolute;right:5px;top:5px;border:0;border-radius:50%;width:28px;height:28px;background:#000b;color:#fff;cursor:pointer}
.planMain{background:#f0efff;border-radius:12px;padding:14px;margin:10px 0;font-weight:700}
.planGood{background:#eaf8ef;color:#176b37;border-radius:10px;padding:10px;margin:8px 0}
.planAlert{background:#fff1f2;color:#a52238;border-radius:10px;padding:10px;margin:8px 0}
.note{font-size:12px;color:#666;font-weight:400}
.tableWrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}
th{color:#666;font-size:12px}
canvas{width:100%;height:280px;border:1px solid #eee;border-radius:12px;background:#fff}
.muted{color:#777;font-size:13px}
.hidden{display:none!important}
.dangerText{color:#b4233c}
.okText{color:#176b37}
@media(max-width:650px){
 .grid,.summaryGrid{grid-template-columns:1fr}
 .wrap{padding:10px}
 .card{padding:13px}
 header h1{font-size:21px}
}
</style>
</head>

<body>

<header>
<div class="wrap">
<h1>🎵 プロセカ ガチャ禁管理</h1>
<p>欲しいカード・実装日・天井・毎日のクリスタルをまとめて管理</p>
</div>
</header>

<main class="wrap">

<section class="card">
<h2>① 欲しいカード</h2>
<div id="targets"></div>
<button class="btn" id="addTarget">＋ 欲しいカードを追加</button>
</section>

<section class="card">
<h2>② 今日のクリスタル</h2>

<div class="grid">

<div class="field">
<label>記録する日付</label>
<input id="recordDate" type="date">
</div>

<div class="field">
<label>その日の所持クリスタル</label>
<input id="current" type="number" min="0" step="1" placeholder="例：23600">
</div>

</div>

<div class="actions">
<button class="btn" id="record">この日付の記録を保存</button>
<button class="btn sub hidden" id="cancelEdit">編集をキャンセル</button>
</div>

<p class="muted">
同じ日付をもう一度保存すると、その日の記録を更新できます。
</p>

</section>


<section class="card">

<h2>③ 必要獲得量の計算</h2>

<div class="grid">

<div class="field">
<label>計算方法</label>

<select id="planMode">

<option value="zero">
カード取得時に残り0にする（先行消費考慮）
</option>

<option value="minimum">
1日あたり必要量を最小にする（余剰を次に繰り越し）
</option>

<option value="constant">
全ての日で同じ獲得量にして間に合わせる
</option>

</select>
</div>

<div class="field">
<label>最高1日クリスタル獲得量（任意）</label>
<input id="maxDaily" type="number" min="0" step="1" placeholder="例：1000">
</div>

</div>

<div id="plan"></div>

</section>


<section class="card">

<h2>④ 現在の状況</h2>

<div id="summary"></div>

</section>


<section class="card">

<h2>⑤ クリスタル推移</h2>

<canvas id="chart" width="900" height="280"></canvas>

</section>


<section class="card">

<h2>⑥ 記録一覧</h2>

<div class="tableWrap">

<table>

<thead>
<tr>
<th>日付</th>
<th>所持数</th>
<th>前回から</th>
<th>操作</th>
</tr>
</thead>

<tbody id="records"></tbody>

</table>

</div>

<div class="actions">

<button class="btn sub" id="exportCsv">
CSVを書き出す
</button>

<label class="btn sub" for="importCsv">
CSVを読み込む
</label>

<input id="importCsv" class="hidden" type="file" accept=".csv,text/csv">

</div>

</section>


<section class="card">

<h2>⑦ データをリセット</h2>

<p class="muted">
この端末に保存しているカード・写真・クリスタル記録をすべて消します。
</p>

<button class="btn danger" id="resetAll">
すべてリセット
</button>

</section>

</main>


<script>

'use strict';


/* =========================
   基本
========================= */

const $=id=>document.getElementById(id);

const KEY='proseka_gachakin_v3';

let data=
JSON.parse(localStorage.getItem(KEY)||'null')
||
{
 targets:[
  {
   id:Date.now(),
   name:'',
   date:'',
   ceiling:90000
  }
 ],
 records:[],
 planMode:'zero',
 maxDaily:0
};

let editingIndex=null;


const esc=s=>
String(s??'').replace(
 /[&<>"']/g,
 c=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 }[c])
);


const fmt=n=>
Number(n||0).toLocaleString('ja-JP');


const save=()=>
localStorage.setItem(KEY,JSON.stringify(data));


const todayStr=()=>{

 const d=new Date();

 return d.getFullYear()
  +'-'
  +String(d.getMonth()+1).padStart(2,'0')
  +'-'
  +String(d.getDate()).padStart(2,'0');

};


const daysBetween=(a,b)=>
(new Date(b+'T00:00:00')-
 new Date(a+'T00:00:00'))/86400000;


const daysUntil=d=>
d?daysBetween(todayStr(),d):null;



/* =========================
   記録
========================= */

function sortedRecords(){

 return data.records
  .filter(r=>
   r &&
   r.date &&
   Number.isFinite(Number(r.crystals))
  )
  .slice()
  .sort((a,b)=>a.date.localeCompare(b.date));

}


function currentCrystals(){

 const r=sortedRecords();

 return r.length
  ?Number(r[r.length-1].crystals)
  :0;

}


function cumulativeDaily(){

 const r=sortedRecords();

 if(r.length<2)return null;

 let totalGain=0;
 let totalDays=0;

 for(let i=1;i<r.length;i++){

  const d=daysBetween(
   r[i-1].date,
   r[i].date
  );

  if(d>0){

   totalGain+=
    Number(r[i].crystals)-
    Number(r[i-1].crystals);

   totalDays+=d;

  }

 }

 return totalDays>0
  ?totalGain/totalDays
  :null;

}



/* =========================
   カード
========================= */

function sortedTargets(){

 return data.targets
  .filter(t=>
   t &&
   t.date &&
   Number.isFinite(Number(t.ceiling)) &&
   Number(t.ceiling)>=0
  )
  .slice()
  .sort((a,b)=>a.date.localeCompare(b.date));

}


function renderTargets(){

 const box=$('targets');

 box.innerHTML='';

 data.targets.forEach((t,i)=>{

  const el=document.createElement('div');

  el.className='target';

  el.innerHTML=`

<div class="targetHead">

<strong>🎯 欲しいカード ${i+1}</strong>

<button
class="btn danger"
onclick="removeTarget(${i})">
削除
</button>

</div>


<div
class="grid"
style="margin-top:10px"
>

<div class="field">

<label>カード名</label>

<input
value="${esc(t.name)}"
oninput="changeTarget(${i},'name',this.value)"
placeholder="例：初音ミク ○○カード"
>

</div>


<div class="field">

<label>実装日</label>

<input
type="date"
value="${esc(t.date)}"
onchange="changeTarget(${i},'date',this.value)"
>

</div>


<div class="field">

<label>天井に必要なクリスタル</label>

<input
type="number"
min="0"
value="${Number(t.ceiling)||0}"
oninput="changeTarget(${i},'ceiling',this.value)"
>

</div>

</div>


<div class="actions">

<label class="btn sub">

📷 写真を追加

<input
class="hidden"
type="file"
accept="image/*"
multiple
onchange="addPhotos(${i},this.files)"
>

</label>


<button
class="btn sub"
onclick="deleteAllPhotos(${i})"
>
写真を全部削除
</button>

</div>


<div
class="photoGrid"
id="photos-${i}"
></div>

`;

  box.appendChild(el);

  loadPhotos(i);

 });

}


window.changeTarget=(i,k,v)=>{

 data.targets[i][k]=
  k==='ceiling'
   ?Math.max(0,Number(v||0))
   :v;

 save();

 update();

};


window.removeTarget=i=>{

 if(!confirm('このカードを削除しますか？'))
  return;

 const id=data.targets[i].id;

 data.targets.splice(i,1);

 save();

 renderTargets();

 update();

 deletePhotos(id);

};



/* =========================
   写真DB
========================= */

let dbPromise=null;


function openDB(){

 if(!('indexedDB' in window))
  return Promise.reject(
   new Error('IndexedDB unavailable')
  );

 if(dbPromise)
  return dbPromise;

 dbPromise=new Promise((res,rej)=>{

  const q=
   indexedDB.open(
    'ProsekaGachaDB_v3',
    1
   );

  q.onupgradeneeded=()=>{

   if(
    !q.result.objectStoreNames
     .contains('images')
   ){

    q.result.createObjectStore(
     'images',
     {
      keyPath:'id',
      autoIncrement:true
     }
    );

   }

  };

  q.onsuccess=()=>res(q.result);

  q.onerror=()=>rej(q.error);

 });

 return dbPromise;

}


async function addPhotos(i,files){

 const t=data.targets[i];

 if(!t)return;

 try{

  const db=await openDB();

  for(
   const f of [...files].slice(0,10)
  ){

   await new Promise((res,rej)=>{

    const tx=
     db.transaction(
      'images',
      'readwrite'
     );

    tx.objectStore('images')
     .add({
      targetId:t.id,
      blob:f,
      name:f.name
     });

    tx.oncomplete=res;

    tx.onerror=()=>rej(tx.error);

   });

  }

  loadPhotos(i);

 }catch(e){

  alert('写真の保存に失敗しました。');

 }

}


async function loadPhotos(i){

 const box=$('photos-'+i);

 if(!box)return;

 box.innerHTML='';

 try{

  const db=await openDB();

  const all=
   await new Promise((res,rej)=>{

    const tx=
     db.transaction(
      'images',
      'readonly'
     );

    const q=
     tx.objectStore('images')
      .getAll();

    q.onsuccess=()=>res(q.result);

    q.onerror=()=>rej(q.error);

   });


  for(
   const row of all.filter(
    x=>x.targetId===data.targets[i]?.id
   )
  ){

   const u=
    URL.createObjectURL(row.blob);

   const d=document.createElement('div');

   d.className='photoItem';

   d.innerHTML=`

<img src="${u}" alt="">

<button
onclick="deletePhoto(${row.id},${i})">
×
</button>

`;

   box.appendChild(d);

  }

 }catch(e){}

}


async function deletePhoto(id,i){

 try{

  const db=await openDB();

  await new Promise((res,rej)=>{

   const tx=
    db.transaction(
     'images',
     'readwrite'
    );

   tx.objectStore('images')
    .delete(id);

   tx.oncomplete=res;

   tx.onerror=()=>rej(tx.error);

  });

  loadPhotos(i);

 }catch(e){}

}


async function deletePhotos(targetId){

 try{

  const db=await openDB();

  const all=
   await new Promise((res,rej)=>{

    const tx=
     db.transaction(
      'images',
      'readonly'
     );

    const q=
     tx.objectStore('images')
      .getAll();

    q.onsuccess=()=>res(q.result);

    q.onerror=()=>rej(q.error);

   });


  for(
   const x of all.filter(
    v=>v.targetId===targetId
   )
  ){

   await deletePhoto(x.id,0);

  }

 }catch(e){}

}


window.addPhotos=addPhotos;

window.deletePhoto=deletePhoto;

window.deleteAllPhotos=
async i=>{

 if(!confirm(
  'このカードの写真を全部削除しますか？'
 ))
  return;

 await deletePhotos(
  data.targets[i].id
 );

 loadPhotos(i);

};



/* =========================================================
   カードごとの「先行消費」を考慮したシミュレーション
========================================================= */

function calculatePlan(ratePerDay){

 const list=sortedTargets();

 const initial=currentCrystals();

 let balance=initial;

 let previousDate=todayStr();

 const rows=[];

 for(const t of list){

  const ceiling=
   Number(t.ceiling||0);

  const d=
   daysBetween(
    previousDate,
    t.date
   );

  const need=
   Math.max(
    0,
    ceiling-balance
   );

  const earned=
   Number.isFinite(ratePerDay)
    ?Math.max(0,d)*ratePerDay
    :0;

  const beforeGet=
   balance+earned;

  const after=
   Math.max(
    0,
    beforeGet-ceiling
   );

  rows.push({

   t,

   d,

   ceiling,

   balanceBefore:balance,

   need,

   earned,

   beforeGet,

   after

  });

  balance=after;

  previousDate=t.date;

 }

 return rows;

}



/* =========================
   現在の状況
========================= */

function renderSummary(){

 const box=$('summary');

 box.innerHTML='';

 const cur=currentCrystals();

 const daily=cumulativeDaily();

 const list=sortedTargets();

 if(!list.length){

  box.innerHTML=
   '<p class="muted">欲しいカードを追加してください。</p>';

  return;

 }


 /*
  ここではカードごとに
  「そのカードを取った後に残るクリスタル」
  を次のカードへ繰り越して表示する。
 */

 let balance=cur;


 list.forEach(t=>{

  const d=daysUntil(t.date);

  const ceiling=
   Number(t.ceiling||0);

  const need=
   Math.max(
    0,
    ceiling-balance
   );

  const dailyNeed=
   d!==null && d>0
    ?Math.ceil(need/d)
    :(need>0?Infinity:0);

  const after=
   Math.max(
    0,
    balance+need-ceiling
   );

  const rate=
   ceiling>0
    ?Math.min(
      100,
      balance/ceiling*100
     )
    :100;

  const e=
   document.createElement('div');

  e.className='summaryBox';

  e.innerHTML=`

<div class="summaryTitle">
🎯 ${esc(t.name||'名前未設定')}
</div>


<div class="summaryGrid">


<div>
<span>実装日</span>
<b>${esc(t.date||'未設定')}</b>
</div>


<div>
<span>実装まで</span>

<b>
${
 d===null
  ?'--'
  :d<0
   ?'実装済み'
   :d+'日'
}
</b>

</div>


<div>
<span>天井</span>
<b>${fmt(ceiling)}個</b>
</div>


<div>
<span>前のカードからの繰越</span>
<b>${fmt(balance)}個</b>
</div>


<div>
<span>このカードまでに必要</span>
<b>${fmt(need)}個</b>
</div>


<div>
<span>必要獲得量/日</span>

<b>
${
 dailyNeed===Infinity
  ?'間に合わない'
  :fmt(dailyNeed)+'個/日'
}
</b>

</div>


<div>
<span>カード取得後の残高</span>
<b>${fmt(after)}個</b>
</div>


<div>
<span>現在の獲得ペース</span>

<b>
${
 daily===null
  ?'--'
  :(daily>=0?'+':'')
   +fmt(Math.round(daily))
   +'個/日'
}
</b>

</div>


</div>


<div class="progress">

<div
class="bar"
style="width:${rate}%">
</div>

</div>

`;

  box.appendChild(e);

  balance=after;

 });

}



/* =========================================================
   必要獲得量
========================================================= */

function renderPlan(){

 const box=$('plan');

 const mode=data.planMode;

 const max=
  Math.max(
   0,
   Number(data.maxDaily||0)
  );

 const initial=
  currentCrystals();

 const list=
  sortedTargets();


 if(!list.length){

  box.innerHTML=
   '<p class="muted">カードの実装日を入力すると計算できます。</p>';

  return;

 }



 /* =====================================================
    zero

    各カードを取るたびに天井分を消費。

    例：

    現在 20,000

    カード1 60,000
    ↓
    40,000貯める
    ↓
    60,000でカード1取得
    ↓
    0

    カード2 120,000
    ↓
    120,000貯める
    ↓
    カード2取得
 ===================================================== */

 if(mode==='zero'){

  let balance=initial;

  let previousDate=todayStr();

  let possible=true;

  let html='';

  for(const t of list){

   const ceiling=
    Number(t.ceiling||0);

   const d=
    daysBetween(
     previousDate,
     t.date
    );

   const need=
    Math.max(
     0,
     ceiling-balance
    );

   let rate;

   if(d>0){

    rate=
     Math.ceil(
      need/d
     );

   }else{

    rate=
     need>0
      ?Infinity
      :0;

   }


   if(
    max>0 &&
    rate>max
   ){

    possible=false;

   }


   const earned=
    Number.isFinite(rate)
     ?rate*Math.max(0,d)
     :0;


   const beforeGet=
    balance+earned;


   /*
    ★ここが重要

    カード取得時に天井分を消費。
    残った分だけ次のカードへ。
   */

   const after=
    Math.max(
     0,
     beforeGet-ceiling
    );


   html+=`

<div class="planMain">

<b>
🎯 ${esc(t.name||'名前未設定')}
</b>

<br><br>


実装日：
<b>
${esc(t.date||'未設定')}
</b>

<br>

実装まで：
<b>
${
 d>=0
  ?fmt(d)+'日'
  :'実装済み'
}
</b>


<br><br>


前のカード取得後の残高：
<b>
${fmt(balance)}個
</b>


<br>


このカードまでに必要：
<b>
${fmt(need)}個
</b>


<br>


必要獲得量：
<b>
${
 Number.isFinite(rate)
  ?fmt(rate)+'個/日'
  :'間に合いません'
}
</b>


<br>


カード取得直前：
<b>
${fmt(beforeGet)}個
</b>


<br>


天井消費：
<b>
-${fmt(ceiling)}個
</b>


<br>


<span class="note">

カード取得後、
次のカードへ繰り越す残高：

<b>
${fmt(after)}個
</b>

</span>

</div>

`;


   balance=after;

   previousDate=t.date;

  }


  if(possible){

   html+=`

<div class="planGood">

✅ 先行カードの消費を考慮して計算しています。<br>

カードを取得したときに天井分を消費し、
残ったクリスタルだけを次のカードへ繰り越します。

</div>

`;

  }else{

   html+=`

<div class="planAlert">

⚠️ 設定した最高1日クリスタル獲得量では、
実装日までに間に合わない区間があります。

</div>

`;

  }


  box.innerHTML=html;

  return;

 }



 /* =====================================================
    constant / minimum

    全カードを間に合わせるために、
    毎日どれだけ必要かを計算する。

    各カード取得後の残高を次のカードに繰り越す。
 ===================================================== */

 if(
  mode==='constant' ||
  mode==='minimum'
 ){

  /*
   二分探索ではなく、
   各カードについて必要な速度を計算。

   カード1までの必要量
   カード2までの必要量
   ...
   
   の最大値を採用する。
  */

  let requiredRate=0;

  let bottleneck=null;

  let balance=initial;

  let previousDate=todayStr();


  for(const t of list){

   const ceiling=
    Number(t.ceiling||0);

   const d=
    daysBetween(
     previousDate,
     t.date
    );

   const need=
    Math.max(
     0,
     ceiling-balance
    );


   let rate;

   if(d>0){

    rate=
     Math.ceil(
      need/d
     );

   }else{

    rate=
     need>0
      ?Infinity
      :0;

   }


   if(rate>requiredRate){

    requiredRate=rate;

    bottleneck=t;

   }


   /*
    現在の必要獲得量で
    このカードまでに貯める。
   */

   if(
    d>0 &&
    Number.isFinite(requiredRate)
   ){

    balance+=
     requiredRate*d;

   }


   /*
    カード取得
   */

   balance=
    Math.max(
     0,
     balance-ceiling
    );


   previousDate=t.date;

  }


  const rows=
   calculatePlan(requiredRate);


  let html=`

<div class="planMain">

${
 mode==='constant'
  ?'毎日同じ量で全カードに間に合わせるための必要獲得量'
  :'全カードを間に合わせるための最低必要獲得量'
}

<br>

<b>

${
 Number.isFinite(requiredRate)
  ?fmt(requiredRate)+'個/日'
  :'計算不能'
}

</b>


${
 max
  ?'<span class="note">（上限：'
   +fmt(max)
   +'個/日）</span>'
  :''
}


${
 bottleneck
  ?'<br><span class="note">最も厳しいカード：'
   +esc(
    bottleneck.name||
    '名前未設定'
   )
   +'</span>'
  :''
}

</div>

`;


  if(
   max &&
   Number.isFinite(requiredRate) &&
   requiredRate>max
  ){

   html+=`

<div class="planAlert">

⚠️ 必要獲得量が設定した最高1日クリスタル獲得量を超えています。

</div>

`;

  }


  rows.forEach(r=>{

   html+=`

<div class="planMain">

<b>
🎯 ${esc(r.t.name||'名前未設定')}
</b>

<br>


実装日まで：

<b>
${
 r.d>=0
  ?fmt(r.d)+'日'
  :'実装済み'
}
</b>


<br>


前のカード取得後の残高：

<b>
${fmt(r.balanceBefore)}個
</b>


<br>


このカードまでに必要：

<b>
${fmt(r.need)}個
</b>


<br>


必要獲得量：

<b>
${
 Number.isFinite(requiredRate)
  ?fmt(requiredRate)+'個/日'
  :'間に合いません'
}
</b>


<br>


カード取得直前：

<b>
${fmt(r.beforeGet)}個
</b>


<br>


天井消費：

<b>
-${fmt(r.ceiling)}個
</b>


<br>


<span class="note">

カード取得後、
次のカードへ繰り越す残高：

<b>
${fmt(r.after)}個
</b>

</span>

</div>

`;

  });


  if(
   Number.isFinite(requiredRate) &&
   (!max || requiredRate<=max)
  ){

   html+=`

<div class="planGood">

✅ カードの実装順と先行消費を考慮して計算済みです。<br>

先に取ったカードで使ったクリスタルを考慮し、
残ったクリスタルは次のカードへ自動的に繰り越します。

</div>

`;

  }else{

   html+=`

<div class="planAlert">

⚠️ 現在の条件では、
すべてのカードを実装日までに確保できません。

</div>

`;

  }


  box.innerHTML=html;

 }

}



/* =========================
   記録一覧
========================= */

function renderRecords(){

 const tb=$('records');

 tb.innerHTML='';

 const r=sortedRecords();


 if(!r.length){

  tb.innerHTML=
   '<tr><td colspan="4" class="muted">まだ記録がありません。</td></tr>';

  return;

 }


 r.slice().reverse().forEach((x,ri)=>{

  const idx=
   data.records.indexOf(x);

  const prev=
   r[r.indexOf(x)-1];

  const diff=
   prev
    ?Number(x.crystals)-
     Number(prev.crystals)
    :null;

  const tr=
   document.createElement('tr');


  tr.innerHTML=`

<td>
${x.date}
</td>

<td>
${fmt(x.crystals)}
</td>

<td>
${
 diff===null
  ?'—'
  :(diff>=0?'+':'')+
   fmt(diff)
}
</td>

<td>

<button
class="btn sub"
onclick="editRecord(${idx})">
編集
</button>

<button
class="btn danger"
onclick="deleteRecord(${idx})">
削除
</button>

</td>

`;

  tb.appendChild(tr);

 });

}


window.editRecord=i=>{

 const r=data.records[i];

 if(!r)return;

 $('recordDate').value=r.date;

 $('current').value=r.crystals;

 editingIndex=i;

 $('record').textContent=
  'この記録を更新';

 $('cancelEdit')
  .classList.remove('hidden');

};


window.deleteRecord=i=>{

 if(!confirm('この記録を削除しますか？'))
  return;

 data.records.splice(i,1);

 if(editingIndex===i)
  cancelEdit();

 save();

 update();

};


function cancelEdit(){

 editingIndex=null;

 $('recordDate').value=
  todayStr();

 $('current').value='';

 $('record').textContent=
  'この日付の記録を保存';

 $('cancelEdit')
  .classList.add('hidden');

}


$('cancelEdit').onclick=
 cancelEdit;


$('record').onclick=()=>{

 const date=
  $('recordDate').value;

 const cr=
  Number($('current').value);


 if(
  !date ||
  !Number.isFinite(cr) ||
  cr<0
 ){

  alert(
   '日付と0以上のクリスタル数を入力してください。'
  );

  return;

 }


 const duplicate=
  data.records.findIndex(
   (r,i)=>
    r.date===date &&
    i!==editingIndex
  );


 if(duplicate>=0){

  alert(
   'その日付の記録はすでにあります。編集で変更してください。'
  );

  return;

 }


 if(editingIndex===null){

  data.records.push({
   date,
   crystals:Math.floor(cr)
  });

 }else{

  data.records[editingIndex]={
   date,
   crystals:Math.floor(cr)
  };

 }


 cancelEdit();

 save();

 update();

};

/* =========================
   グラフ
========================= */

function drawChart(){

 const c=$('chart');

 const ctx=c.getContext('2d');

 const W=c.width;

 const H=c.height;

 ctx.clearRect(0,0,W,H);

 const r=sortedRecords();


 if(!r.length){

  ctx.fillStyle='#888';

  ctx.font='14px sans-serif';

  ctx.fillText(
   'クリスタルを記録するとグラフが表示されます',
   W/2-150,
   H/2
  );

  return;

 }


 const max=
  Math.max(
   1,
   ...r.map(
    x=>Number(x.crystals)
   ),
   ...data.targets.map(
    x=>Number(x.ceiling||0)
   )
  );


 const p={
  l:55,
  r:15,
  t:20,
  b:35
 };


 ctx.strokeStyle='#ddd';


 for(let i=0;i<=4;i++){

  const y=
   p.t+
   (H-p.t-p.b)*i/4;

  ctx.beginPath();

  ctx.moveTo(p.l,y);

  ctx.lineTo(
   W-p.r,
   y
  );

  ctx.stroke();

  ctx.fillStyle='#777';

  ctx.font='11px sans-serif';

  ctx.fillText(
   fmt(
    Math.round(
     max*(4-i)/4
    )
   ),
   5,
   y+4
  );

 }


 const X=i=>
  r.length===1
   ?W/2
   :p.l+
    (W-p.l-p.r)*
    i/(r.length-1);


 const Y=v=>
  H-p.b-
  (H-p.t-p.b)*
  v/max;


 ctx.strokeStyle='#6c63ff';

 ctx.lineWidth=3;

 ctx.beginPath();


 r.forEach((x,i)=>{

  const xx=X(i);

  const yy=Y(
   x.crystals
  );

  if(i)
   ctx.lineTo(xx,yy);
  else
   ctx.moveTo(xx,yy);

 });


 ctx.stroke();


 ctx.fillStyle='#6c63ff';


 r.forEach((x,i)=>{

  ctx.beginPath();

  ctx.arc(
   X(i),
   Y(x.crystals),
   4,
   0,
   Math.PI*2
  );

  ctx.fill();

 });

}

/* =========================
   CSV
========================= */

$('exportCsv').onclick=()=>{

 const rows=[
  ['date','crystals'],
  ...sortedRecords()
   .map(r=>[
    r.date,
    r.crystals
   ])
 ];

 const csv=
  '\uFEFF'+
  rows
   .map(a=>a.join(','))
   .join('\n');

 const blob=
  new Blob(
   [csv],
   {
    type:'text/csv;charset=utf-8'
   }
  );

 const a=
  document.createElement('a');

 a.href=
  URL.createObjectURL(blob);

 a.download=
  'proseka_crystals.csv';

 a.click();

 URL.revokeObjectURL(
  a.href
 );

};


$('importCsv').onchange=e=>{

 const f=e.target.files[0];

 if(!f)return;

 const rd=
  new FileReader();


 rd.onload=()=>{

  const lines=
   String(rd.result)
    .replace(/^\uFEFF/,'')
    .trim()
    .split(/\r?\n/);


  const imported=[];


  for(let i=1;i<lines.length;i++){

   const [
    date,
    cr
   ]=
    lines[i].split(',');


   if(
    /^\d{4}-\d{2}-\d{2}$/.test(date) &&
    Number.isFinite(Number(cr))
   ){

    imported.push({
     date,
     crystals:Number(cr)
    });

   }

  }


  if(imported.length){

   data.records=
    imported;

   save();

   update();

   alert(
    imported.length+
    '件読み込みました。'
   );

  }else{

   alert(
    '読み込める記録がありません。'
   );

  }

 };


 rd.readAsText(
  f,
  'utf-8'
 );

 e.target.value='';

};
