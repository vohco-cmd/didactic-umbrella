<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6c63ff">
<link rel="manifest" href="manifest.webmanifest">
<title>プロセカ ガチャ禁管理</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f5f6fb;
 color:#202124;
 font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif
}

header{
 background:linear-gradient(135deg,#6c63ff,#8d7cff);
 color:#fff;
 padding:22px 16px
}

header h1{
 margin:0;
 font-size:24px
}

header p{
 margin:6px 0 0;
 opacity:.9;
 font-size:13px
}

.wrap{
 max-width:980px;
 margin:auto;
 padding:14px
}

.card{
 background:#fff;
 border-radius:16px;
 padding:16px;
 margin:12px 0;
 box-shadow:0 3px 14px #0000000d
}

.card h2{
 font-size:18px;
 margin:0 0 12px
}

.grid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:10px
}

.field label{
 display:block;
 font-size:12px;
 font-weight:700;
 margin:0 0 5px;
 color:#666
}

.field input,
.field select{
 width:100%;
 padding:10px;
 border:1px solid #d9d9e3;
 border-radius:10px;
 background:#fff;
 font:inherit
}

.btn{
 border:0;
 border-radius:10px;
 padding:10px 14px;
 background:#6c63ff;
 color:#fff;
 font-weight:700;
 cursor:pointer
}

.btn.sub{
 background:#eeeef5;
 color:#333
}

.btn.danger{
 background:#ffe8ec;
 color:#b4233c
}

.actions{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin-top:10px
}

.target{
 border:1px solid #e2e2eb;

 padding:14px;
 margin:10px 0
}

.targetHead{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:8px
}

.targetHead strong{
 font-size:16px
}

.summaryBox{
 border:1px solid #e3e2f4;
 background:#faf9ff;
 border-radius:14px;
 padding:14px;
 margin:10px 0
}

.summaryTitle{

 margin-bottom:10px
}

.summaryGrid{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:8px
}

.summaryGrid>div{

 border-radius:10px;
 padding:9px
}

.summaryGrid span{
 display:block;
 font-size:11px;

}

.summaryGrid b{
 display:block;
 margin-top:3px;
 font-size:15px
}

.progress{
 height:9px;
 background:#e9e9f1;
 border-radius:99px;
 overflow:hidden;
 margin-top:10px
}

.bar{

}

.photoGrid{

.photoItem{

}

.planMain{

}

.planGood{

}

.planAlert{

}

 .grid,.summaryGrid{
  grid-template-columns:1fr

}

<body>

<header>
<div class="wrap">
<h1>🎵 プロセカ ガチャ禁管理</h1>
<p>欲しいカード・実装日・天井・毎日のクリスタルをまとめて管理</p>
</div>
</header>

<main class="wrap">

<section class="card">
<h2>① 欲しいカード</h2>
<div id="targets"></div>
<button class="btn" id="addTarget">＋ 欲しいカードを追加</button>
</section>

<section class="card">

<h2>② 今日のクリスタル</h2>

<div class="grid">

<div class="field">
<label>記録する日付</label>
<input id="recordDate" type="date">
</div>

<div class="field">
<label>その日の所持クリスタル</label>
<input id="current" type="number" min="0" step="1" placeholder="例：23600">
</div>

</div>

<div class="actions">
<button class="btn" id="record">この日付の記録を保存</button>

</p>

</section>

<h2>③ 必要獲得量の計算</h2>

<div class="grid">

<div class="field">

<label>計算方法</label>

<select id="planMode">

<option value="zero">
カードごとに天井分を確保する
</option>

<option value="minimum">
全カードを考慮して1日あたり必要量を最小にする
</option>

<option value="constant">
全期間で毎日同じ量にする
</option>

</select>

</div>

<div class="field">

<label>最高1日クリスタル獲得量（任意）</label>

<input
id="maxDaily"
type="number"
min="0"
step="1"
placeholder="例：1000"
>

</div>

</div>

<div id="plan"></div>

</section>

<section class="card">

<h2>④ 現在の状況</h2>

<div id="summary"></div>

</section>

<section class="card">

<h2>⑤ クリスタル推移</h2>

<canvas
id="chart"
width="900"
height="280">
</canvas>

</section>

<section class="card">

<h2>⑥ 記録一覧</h2>

<div class="tableWrap">

<table>

<thead>

<tr>
<th>日付</th>
<th>所持数</th>
<th>前回から</th>

</tr>

</thead>

<tbody id="records"></tbody>

</table>

</div>

<button
class="btn sub"
id="exportCsv">
CSVを書き出す
</button>

<label
class="btn sub"
for="importCsv">
CSVを読み込む
</label>

id="importCsv"
class="hidden"
type="file"

>

</div>

</section>

<section class="card">

<h2>⑦ データをリセット</h2>

この端末に保存しているカード・写真・クリスタル記録をすべて消します。
</p>

<button
class="btn danger"
id="resetAll">
すべてリセット
</button>

</main>

<script>

'use strict';


/* =====================================================
   基本
===================================================== */

const $=id=>document.getElementById(id);

const KEY='proseka_gachakin_v3';


let data=
JSON.parse(localStorage.getItem(KEY)||'null')
||
{
 targets:[
  {
   id:Date.now(),
   name:'',
   date:'',
   ceiling:90000
  }
 ],
 records:[],
 planMode:'minimum',
 maxDaily:0
};


let editingIndex=null;


const esc=s=>
String(s??'').replace(
 /[&<>"']/g,
 c=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 }[c])
);


const fmt=n=>
Number(n||0).toLocaleString('ja-JP');


const save=()=>
localStorage.setItem(KEY,JSON.stringify(data));


const todayStr=()=>{

 const d=new Date();

 return d.getFullYear()
 +'-'
 +String(d.getMonth()+1).padStart(2,'0')
 +'-'
 +String(d.getDate()).padStart(2,'0');

};


const daysBetween=(a,b)=>
(
 new Date(b+'T00:00:00')-
 new Date(a+'T00:00:00')
)/86400000;


const daysUntil=d=>
 d?daysBetween(todayStr(),d):null;



/* =====================================================
   記録
===================================================== */

function sortedRecords(){

 return data.records
 .filter(r=>
  r &&
  r.date &&
  Number.isFinite(Number(r.crystals))
 )
 .slice()
 .sort((a,b)=>a.date.localeCompare(b.date));

}


function currentCrystals(){

 const r=sortedRecords();

 return r.length
  ?Number(r[r.length-1].crystals)
  :0;

}


function cumulativeDaily(){

 const r=sortedRecords();

 if(r.length<2)
  return null;

 let totalGain=0;
 let totalDays=0;

 for(let i=1;i<r.length;i++){

  const d=daysBetween(
   r[i-1].date,
   r[i].date
  );

  if(d>0){

   totalGain+=
    Number(r[i].crystals)-
    Number(r[i-1].crystals);

   totalDays+=d;

  }

 }

 return totalDays>0
  ?totalGain/totalDays
  :null;

}



/* =====================================================
   カード
===================================================== */

function sortedTargets(){

 return data.targets
 .filter(t=>
  t &&
  t.date &&
  Number.isFinite(Number(t.ceiling)) &&
  Number(t.ceiling)>=0
 )
 .slice()
 .sort((a,b)=>a.date.localeCompare(b.date));

}


function renderTargets(){

 const box=$('targets');

 box.innerHTML='';

 data.targets.forEach((t,i)=>{

  const el=document.createElement('div');

  el.className='target';

  el.innerHTML=`

<div class="targetHead">

<strong>
🎯 欲しいカード ${i+1}
</strong>

<button
class="btn danger"
onclick="removeTarget(${i})">
削除
</button>

</div>

<div
class="grid"
style="margin-top:10px"
>

<div class="field">

<label>カード名</label>

<input
value="${esc(t.name)}"
oninput="changeTarget(${i},'name',this.value)"
placeholder="例：初音ミク ○○カード"
>

</div>

<div class="field">

<label>実装日</label>

<input
type="date"
value="${esc(t.date)}"
onchange="changeTarget(${i},'date',this.value)"
>

</div>

<div class="field">

<label>天井に必要なクリスタル</label>

<input
type="number"
min="0"
value="${Number(t.ceiling)||0}"
oninput="changeTarget(${i},'ceiling',this.value)"
>

</div>

</div>

<div class="actions">

<label class="btn sub">

📷 写真を追加

<input
class="hidden"
type="file"
accept="image/*"
multiple
onchange="addPhotos(${i},this.files)"
>

</label>

<button
class="btn sub"
onclick="deleteAllPhotos(${i})">
写真を全部削除
</button>

</div>

<div
class="photoGrid"
id="photos-${i}">
</div>

`;

  box.appendChild(el);

  loadPhotos(i);

 });

}


window.changeTarget=(i,k,v)=>{

 data.targets[i][k]=
  k==='ceiling'
   ?Math.max(0,Number(v||0))
   :v;

 save();

 update();

};


window.removeTarget=i=>{

 if(!confirm('このカードを削除しますか？'))
  return;

 const id=data.targets[i].id;

 data.targets.splice(i,1);

 save();

 renderTargets();

 update();

 deletePhotos(id);

};



/* =====================================================
   写真DB
===================================================== */

let dbPromise=null;


function openDB(){

 if(!('indexedDB' in window))
  return Promise.reject(
   new Error('IndexedDB unavailable')
  );

 if(dbPromise)
  return dbPromise;

 dbPromise=new Promise((res,rej)=>{

  const q=indexedDB.open(
   'ProsekaGachaDB_v3',
   1
  );

  q.onupgradeneeded=()=>{

   if(
    !q.result.objectStoreNames
    .contains('images')
   ){

    q.result.createObjectStore(
     'images',
     {
      keyPath:'id',
      autoIncrement:true
     }
    );

   }

  };

  q.onsuccess=()=>res(q.result);

  q.onerror=()=>rej(q.error);

 });

 return dbPromise;

}


async function addPhotos(i,files){

 const t=data.targets[i];

 if(!t)return;

 try{

  const db=await openDB();

  for(
   const f of [...files].slice(0,10)
  ){

   await new Promise((res,rej)=>{

    const tx=
     db.transaction(
      'images',
      'readwrite'
     );

    tx.objectStore('images').add({
     targetId:t.id,
     blob:f,
     name:f.name
    });

    tx.oncomplete=res;

    tx.onerror=()=>rej(tx.error);

   });

  }

  loadPhotos(i);

 }catch(e){

  alert('写真の保存に失敗しました。');

 }

}


async function loadPhotos(i){

 const box=$('photos-'+i);

 if(!box)return;

 box.innerHTML='';

 try{

  const db=await openDB();

  const all=
   await new Promise((res,rej)=>{

    const tx=
     db.transaction(
      'images',
      'readonly'
     );

    const q=
     tx.objectStore('images').getAll();

    q.onsuccess=()=>res(q.result);

    q.onerror=()=>rej(q.error);

   });


  for(
   const row of all.filter(
    x=>x.targetId===data.targets[i]?.id
   )
  ){

   const u=
    URL.createObjectURL(row.blob);

   const d=document.createElement('div');

   d.className='photoItem';

   d.innerHTML=`

<img src="${u}" alt="">

<button
onclick="deletePhoto(${row.id},${i})">
×
</button>

`;

   box.appendChild(d);

  }

 }catch(e){}

}


async function deletePhoto(id,i){

 try{

  const db=await openDB();

  await new Promise((res,rej)=>{

   const tx=
    db.transaction(
     'images',
     'readwrite'
    );

   tx.objectStore('images').delete(id);

   tx.oncomplete=res;

   tx.onerror=()=>rej(tx.error);

  });

  loadPhotos(i);

 }catch(e){}

}


async function deletePhotos(targetId){

 try{

  const db=await openDB();

  const all=
   await new Promise((res,rej)=>{

    const tx=
     db.transaction(
      'images',
      'readonly'
     );

    const q=
     tx.objectStore('images').getAll();

    q.onsuccess=()=>res(q.result);

    q.onerror=()=>rej(q.error);

   });


  for(
   const x of all.filter(
    v=>v.targetId===targetId
   )
  ){

   await deletePhoto(x.id,0);

  }

 }catch(e){}

}


window.addPhotos=addPhotos;
window.deletePhoto=deletePhoto;

window.deleteAllPhotos=async i=>{

 if(!confirm(
  'このカードの写真を全部削除しますか？'
 ))
  return;

 await deletePhotos(
  data.targets[i].id
 );

 loadPhotos(i);

};



/* =====================================================
   計算エンジン
===================================================== */

/*
  rate = 1日あたり獲得するクリスタル

  現在の残高
      ↓
  カード①までrate×日数を獲得
      ↓
  カード①の天井を消費
      ↓
  残りをカード②へ
      ↓
  ...
*/


function simulate(rate){

 const list=sortedTargets();

 let balance=currentCrystals();

 let previousDate=todayStr();

 let totalEarned=0;
 let totalSpent=0;

 const rows=[];


 for(const t of list){

  const ceiling=Math.max(
   0,
   Number(t.ceiling||0)
  );


  /*
    過去の日付は0日として扱う。
  */

  const days=Math.max(
   0,
   daysBetween(
    previousDate,
    t.date
   )
  );


  const earned=
   Number.isFinite(rate)
    ?rate*days
    :0;


  const beforeGet=
   balance+earned;


  const shortfall=Math.max(
   0,
   ceiling-beforeGet
  );


  const possible=
   beforeGet>=ceiling;


  /*
    取れる場合は天井分を消費。
    余った分はそのまま次へ。
  */

  const after=
   possible
    ?beforeGet-ceiling
    :0;


  rows.push({

   t:t,
   days:days,
   ceiling:ceiling,
   startBalance:balance,
   earned:earned,
   beforeGet:beforeGet,
   shortfall:shortfall,
   after:after,
   possible:possible

  });


  totalEarned+=earned;


  if(possible){

   totalSpent+=ceiling;

  }else{

   totalSpent+=beforeGet;

  }


  balance=after;

  previousDate=t.date;

 }


 return {

  rows:rows,
  finalBalance:balance,
  totalEarned:totalEarned,
  totalSpent:totalSpent

 };

}



/* =====================================================
   全カードを期限内に取れるか
===================================================== */

function isSimulationPossible(rate){

 const result=simulate(rate);

 return result.rows.every(
  r=>r.possible
 );

}



/* =====================================================
   全カードを考慮した最低1日量
===================================================== */

function findMinimumConstantRate(){

 const list=sortedTargets();

 if(!list.length)
  return 0;


 /*
   最初のカードが今日より前の場合、
   そのカードまでの日数は0。

   現在の残高で足りないなら、
   今日からの獲得だけでは間に合わない。
 */

 const first=list[0];

 const firstDays=
  daysBetween(
   todayStr(),
   first.date
  );


 if(
  firstDays<0 &&
  currentCrystals()<
   Number(first.ceiling||0)
 ){

  return Infinity;

 }


 /*
   まず間に合う上限を探す。
 */

 let low=0;
 let high=1;


 while(
  high<100000000 &&
  !isSimulationPossible(high)
 ){

  high*=2;

 }


 if(
  high>=100000000 &&
  !isSimulationPossible(high)
 ){

  return Infinity;

 }


 /*
   1日量を二分探索。

   ここで全カードを同時に判定するため、

   「①を少し余らせて②を楽にする」

   という繰り越しも自動的に考慮される。
 */

 for(let i=0;i<60;i++){

  const mid=(low+high)/2;

  if(
   isSimulationPossible(mid)
  ){

   high=mid;

  }else{

   low=mid;

  }

 }


 return Math.ceil(high);

}



/* =====================================================
   ④ 現在の状況
===================================================== */

function renderSummary(){

 const box=$('summary');

 box.innerHTML='';

 const list=sortedTargets();

 const cur=currentCrystals();

 const daily=cumulativeDaily();


 if(!list.length){

  box.innerHTML=
   '<p class="muted">欲しいカードを追加してください。</p>';

  return;

 }


 /*
   現在の残高だけを基準に、
   カードを順番に見ていく。
 */

 let balance=cur;

 let previousDate=todayStr();


 list.forEach((t,index)=>{

  const ceiling=Math.max(
   0,
   Number(t.ceiling||0)
  );


  const daysToCard=
   daysBetween(
    todayStr(),
    t.date
   );


  const intervalDays=Math.max(
   0,
   daysBetween(
    previousDate,
    t.date
   )
  );


  const needNow=Math.max(
   0,
   ceiling-balance
  );


  const dailyNeed=
   intervalDays>0
    ?Math.ceil(needNow/intervalDays)
    :(needNow>0?Infinity:0);


  /*
    現在残高だけで引いた場合。
  */

  const afterNow=Math.max(
   0,
   balance-ceiling
  );


  const rate=
   ceiling>0
    ?Math.min(
     100,
     balance/ceiling*100
    )
    :100;


  const e=
   document.createElement('div');

  e.className='summaryBox';


  e.innerHTML=`

<div class="summaryTitle">

🎯 ${esc(t.name||'名前未設定')}

</div>


<div class="summaryGrid">


<div>
<span>実装日</span>
<b>${esc(t.date)}</b>
</div>


<div>
<span>実装まで</span>
<b>
${
 daysToCard<0
  ?'実装済み'
  :fmt(daysToCard)+'日'
}
</b>
</div>


<div>
<span>天井</span>
<b>${fmt(ceiling)}個</b>
</div>


<div>
<span>現在の繰越</span>
<b>${fmt(balance)}個</b>
</div>


<div>
<span>現在の不足分</span>
<b>${fmt(needNow)}個</b>
</div>


<div>
<span>不足分を貯める場合</span>
<b>
${
 dailyNeed===Infinity
  ?'間に合わない'
  :fmt(dailyNeed)+'個/日'
}
</b>
</div>


<div>
<span>取得後の残高</span>
<b>${fmt(afterNow)}個</b>
</div>


<div>
<span>現在の獲得ペース</span>
<b>
${
 daily===null
  ?'--'
  :(daily>=0?'+':'')+
   fmt(Math.round(daily))+
   '個/日'
}
</b>
</div>


</div>


<div class="progress">

<div
class="bar"
style="width:${rate}%">
</div>

</div>

`;

  box.appendChild(e);


  balance=afterNow;

  previousDate=t.date;

 });

}



/* =====================================================
   ③ 必要獲得量
===================================================== */

function renderPlan(){

 const box=$('plan');

 const list=sortedTargets();

 const mode=data.planMode||'minimum';

 const max=Math.max(
  0,
  Number(data.maxDaily||0)
 );


 if(!list.length){

  box.innerHTML=
   '<p class="muted">カードの実装日を入力すると計算できます。</p>';

  return;

 }


 /* =====================================================
    zero
 ===================================================== */

 if(mode==='zero'){

  let html='';

  let balance=currentCrystals();

  let previousDate=todayStr();

  let totalNeed=0;


  for(const t of list){

   const ceiling=Math.max(
    0,
    Number(t.ceiling||0)
   );


   const days=Math.max(
    0,
    daysBetween(
     previousDate,
     t.date
    )
   );


   const need=Math.max(
    0,
    ceiling-balance
   );


   const rate=
    days>0
     ?Math.ceil(need/days)
     :(need>0?Infinity:0);


   const earned=
    Number.isFinite(rate)
     ?rate*days
     :0;


   const beforeGet=
    balance+earned;


   const after=Math.max(
    0,
    beforeGet-ceiling
   );


   totalNeed+=need;


   html+=`

<div class="planMain">

<div style="font-size:18px;margin-bottom:12px">

🎯 ${esc(t.name||'名前未設定')}

</div>


<div class="summaryGrid">


<div>
<span>実装日</span>
<b>${esc(t.date)}</b>
</div>


<div>
<span>期間</span>
<b>${fmt(days)}日</b>
</div>


<div>
<span>天井</span>
<b>${fmt(ceiling)}個</b>
</div>


<div>
<span>繰越</span>
<b>${fmt(balance)}個</b>
</div>


<div>
<span>追加で必要</span>
<b>${fmt(need)}個</b>
</div>


<div>
<span>必要量/日</span>
<b>
${
 Number.isFinite(rate)
  ?fmt(rate)+'個/日'
  :'間に合いません'
}
</b>
</div>


</div>


<div style="
margin-top:14px;
padding:12px;
background:#fff;
border-radius:10px;
line-height:1.8;
">

${fmt(balance)}個
＋ ${fmt(earned)}個
＝ <strong>${fmt(beforeGet)}個</strong>

<br>

− ${fmt(ceiling)}個

<br>

＝ <strong>${fmt(after)}個</strong>

<br>

<span class="note">
取得後、この残高を次のカードへ繰り越します。
</span>

</div>

</div>

`;

   balance=after;

   previousDate=t.date;

  }


  html=`

<div class="totalBox">

<div>
これから追加で必要なクリスタル
</div>

<div class="big">
${fmt(totalNeed)} 個
</div>

<div class="note" style="color:#fff">
カードを順番に取得した場合の合計です。
</div>

</div>

`
  +html;


  box.innerHTML=html;

  return;

 }



 /* =====================================================
    ★ minimum
    全カードを考慮した最小1日量
 ===================================================== */

 if(mode==='minimum'){

  const rate=findMinimumConstantRate();


  if(!Number.isFinite(rate)){

   box.innerHTML=`

<div class="planAlert">

⚠️

現在のクリスタルとカードの実装日では、
最初のカードまでに必要な量を
計算できません。

</div>

`;

   return;

  }


  const result=simulate(rate);

  let html='';


  html+=`

<div class="totalBox">

<div>
🎯 全カードを考慮した最小必要獲得量
</div>

<div class="big">
${fmt(rate)} 個/日
</div>

<div class="note" style="color:#fff">

途中のカードでクリスタルを余らせてもOKとして、
その余りを後のカードへ繰り越した場合の
「全カードを期限内に取れる最低値」です。

</div>

</div>

`;


  if(
   max>0 &&
   rate>max
  ){

   html+=`

<div class="planAlert">

⚠️

必要なのは
<strong>${fmt(rate)}個/日</strong>です。

設定した最高獲得量は
<strong>${fmt(max)}個/日</strong>
なので、この条件では間に合いません。

</div>

`;

  }


  /*
    各カードの詳細
  */

  result.rows.forEach((r,i)=>{

   html+=`

<div class="planMain">

<div style="
font-size:18px;
margin-bottom:14px;
">

🎯 ${esc(r.t.name||'名前未設定')}

</div>


<div class="summaryGrid">


<div>
<span>実装日</span>
<b>${esc(r.t.date)}</b>
</div>


<div>
<span>この期間</span>
<b>${fmt(r.days)}日</b>
</div>


<div>
<span>天井</span>
<b>${fmt(r.ceiling)}個</b>
</div>


<div>
<span>前のカード後の繰越</span>
<b>${fmt(r.startBalance)}個</b>
</div>


<div>
<span>この期間の獲得</span>
<b>+${fmt(r.earned)}個</b>
</div>


<div>
<span>取得直前</span>
<b>${fmt(r.beforeGet)}個</b>
</div>


</div>


<div style="
margin-top:14px;
padding:14px;
background:#fff;
border-radius:10px;
line-height:1.9;
">

<strong>📊 このカードの処理</strong>

<br><br>

${fmt(r.startBalance)}個

＋ ${fmt(r.earned)}個

＝

<strong>
${fmt(r.beforeGet)}個
</strong>

<br>

− ${fmt(r.ceiling)}個
（天井消費）

<br>

＝

<strong>
${fmt(r.after)}個
</strong>

（次のカードへ繰越）

</div>


${
r.after>0
?`

<div class="planGood">

💰

このカードでは
<strong>${fmt(r.after)}個</strong>
余ります。

<br>

この余りは次のカードの資金として
そのまま使われます。

</div>

`
:''
}


</div>

`;

  });


  html+=`

<div class="summaryBox">

<div class="summaryTitle">
🏁 最終結果
</div>


<div class="summaryGrid">


<div>
<span>最小1日獲得量</span>
<b>${fmt(rate)}個</b>
</div>


<div>
<span>全期間の獲得量</span>
<b>${fmt(result.totalEarned)}個</b>
</div>


<div>
<span>最後のカード取得後</span>
<b>${fmt(result.finalBalance)}個</b>
</div>


</div>


<div class="planGood">

✅

<strong>
全カードを順番に考慮して計算しています。
</strong>

<br><br>

カード①をぴったりにするのではなく、
カード①で余った分をカード②へ、
カード②で余った分をカード③へ、
という形で最後まで繰り越します。

</div>

</div>

`;


  box.innerHTML=html;

  return;

 }



 /* =====================================================
    constant
 ===================================================== */

 if(mode==='constant'){

  const rate=findMinimumConstantRate();


  if(!Number.isFinite(rate)){

   box.innerHTML=`

<div class="planAlert">

⚠️
一定の1日獲得量では計算できません。

</div>

`;

   return;

  }


  const result=simulate(rate);

  let html=`


<div class="totalBox">

<div>
🎯 全期間で毎日同じ量にする場合
</div>

<div class="big">
${fmt(rate)} 個/日
</div>

<div class="note" style="color:#fff">

全カードを期限内に取得できる
最低の一定ペースです。

</div>

</div>

`;


  if(
   max>0 &&
   rate>max
  ){

   html+=`

<div class="planAlert">

⚠️

必要な獲得量は
<strong>${fmt(rate)}個/日</strong>です。

最高設定の
<strong>${fmt(max)}個/日</strong>
では間に合いません。

</div>

`;

  }


  result.rows.forEach(r=>{

   html+=`

<div class="planMain">

<div style="
font-size:18px;
margin-bottom:12px;
">

🎯 ${esc(r.t.name||'名前未設定')}

</div>


<div class="summaryGrid">


<div>
<span>実装日</span>
<b>${esc(r.t.date)}</b>
</div>


<div>
<span>期間</span>
<b>${fmt(r.days)}日</b>
</div>


<div>
<span>天井</span>
<b>${fmt(r.ceiling)}個</b>
</div>


<div>
<span>前カード後</span>
<b>${fmt(r.startBalance)}個</b>
</div>


<div>
<span>期間中の獲得</span>
<b>+${fmt(r.earned)}個</b>
</div>


<div>
<span>取得直前</span>
<b>${fmt(r.beforeGet)}個</b>
</div>


</div>


<div style="
margin-top:14px;
padding:12px;
background:#fff;
border-radius:10px;
line-height:1.8;
">

− ${fmt(r.ceiling)}個
（天井消費）

<br>

<strong>
取得後の繰越：
${fmt(r.after)}個
</strong>

</div>


${
r.after>0
?`

<div class="planGood">

💰
<strong>${fmt(r.after)}個</strong>
を次のカードへ繰り越します。

</div>

`
:''
}


</div>

`;

  });


  box.innerHTML=html;

  return;

 }

}



/* =====================================================
   記録一覧
===================================================== */

function renderRecords(){

 const tb=$('records');

 tb.innerHTML='';

 const r=sortedRecords();


 if(!r.length){

  tb.innerHTML=
   '<tr><td colspan="4" class="muted">まだ記録がありません。</td></tr>';

  return;

 }


 r.slice().reverse().forEach(x=>{

  const idx=
   data.records.indexOf(x);

  const pos=
   r.indexOf(x);

  const prev=
   r[pos-1];

  const diff=
   prev
    ?Number(x.crystals)-
     Number(prev.crystals)
    :null;


  const tr=
   document.createElement('tr');


  tr.innerHTML=`

<td>${x.date}</td>

<td>${fmt(x.crystals)}</td>

<td>
${
 diff===null
  ?'—'
  :(diff>=0?'+':'')+
   fmt(diff)
}
</td>

<td>

<button
class="btn sub"
onclick="editRecord(${idx})">
編集
</button>

<button
class="btn danger"
onclick="deleteRecord(${idx})">
削除
</button>

</td>

`;

  tb.appendChild(tr);

 });

}



window.editRecord=i=>{

 const r=data.records[i];

 if(!r)return;

 $('recordDate').value=r.date;

 $('current').value=r.crystals;

 editingIndex=i;

 $('record').textContent=
  'この記録を更新';

 $('cancelEdit')
  .classList.remove('hidden');

};


window.deleteRecord=i=>{

 if(!confirm(
  'この記録を削除しますか？'
 ))
  return;

 data.records.splice(i,1);

 if(editingIndex===i)
  cancelEdit();

 save();

 update();

};


function cancelEdit(){

 editingIndex=null;

 $('recordDate').value=
  todayStr();

 $('current').value='';

 $('record').textContent=
  'この日付の記録を保存';

 $('cancelEdit')
  .classList.add('hidden');

}


$('cancelEdit').onclick=
 cancelEdit;


$('record').onclick=()=>{

 const date=
  $('recordDate').value;

 const cr=
  Number($('current').value);


 if(
  !date||
  !Number.isFinite(cr)||
  cr<0
 ){

  alert(
   '日付と0以上のクリスタル数を入力してください。'
  );

  return;

 }


 const duplicate=
  data.records.findIndex(
   (r,i)=>
    r.date===date&&
    i!==editingIndex
  );


 if(duplicate>=0){

  alert(
   'その日付の記録はすでにあります。編集で変更してください。'
  );

  return;

 }


 if(editingIndex===null){

  data.records.push({
   date:date,
   crystals:Math.floor(cr)
  });

 }else{

  data.records[editingIndex]={
   date:date,
   crystals:Math.floor(cr)
  };

 }


 cancelEdit();

 save();

 update();

};

/* =====================================================
   グラフ
===================================================== */

function drawChart(){

 const c=$('chart');

 const ctx=c.getContext('2d');

 const W=c.width;

 const H=c.height;

 ctx.clearRect(
  0,
  0,
  W,
  H
 );


 const r=sortedRecords();


 if(!r.length){

  ctx.fillStyle='#888';

  ctx.font='14px sans-serif';

  ctx.fillText(
   'クリスタルを記録するとグラフが表示されます',
   W/2-150,
   H/2
  );

  return;

 }


 const max=
  Math.max(
   1,
   ...r.map(
    x=>Number(x.crystals)
   ),
   ...data.targets.map(
    x=>Number(x.ceiling||0)
   )
  );


 const p={
  l:55,
  r:15,
  t:20,
  b:35
 };


 ctx.strokeStyle='#ddd';


 for(let i=0;i<=4;i++){

  const y=
   p.t+
   (H-p.t-p.b)*i/4;

  ctx.beginPath();

  ctx.moveTo(p.l,y);

  ctx.lineTo(
   W-p.r,
   y
  );

  ctx.stroke();

  ctx.fillStyle='#777';

  ctx.font='11px sans-serif';

  ctx.fillText(
   fmt(
    Math.round(
     max*(4-i)/4
    )
   ),
   5,
   y+4
  );

 }


 const X=i=>
  r.length===1
   ?W/2
   :p.l+
    (W-p.l-p.r)*
    i/(r.length-1);


 const Y=v=>
  H-p.b-
  (H-p.t-p.b)*
  v/max;


 ctx.strokeStyle='#6c63ff';

 ctx.lineWidth=3;

 ctx.beginPath();


 r.forEach((x,i)=>{

  const xx=X(i);

  const yy=Y(
   x.crystals
  );

  if(i)
   ctx.lineTo(
    xx,
    yy
   );
  else
   ctx.moveTo(
    xx,
    yy
   );

 });


 ctx.stroke();


 ctx.fillStyle='#6c63ff';


 r.forEach((x,i)=>{

  ctx.beginPath();

  ctx.arc(
   X(i),
   Y(x.crystals),
   4,
   0,
   Math.PI*2
  );

  ctx.fill();

 });

}



/* =====================================================
   全体更新
===================================================== */

function update(){

 $('planMode').value=
  data.planMode||'minimum';

 $('maxDaily').value=
  data.maxDaily||'';

 renderSummary();

 renderPlan();

 renderRecords();

 drawChart();

}



/* =====================================================
   CSV
===================================================== */

$('exportCsv').onclick=()=>{

 const rows=[
  ['date','crystals'],
  ...sortedRecords().map(
   r=>[
    r.date,
    r.crystals
   ]
  )
 ];


 const csv=
  '\uFEFF'+
  rows
   .map(a=>a.join(','))
   .join('\n');


 const blob=
  new Blob(
   [csv],
   {
    type:'text/csv;charset=utf-8'
   }
  );


 const a=
  document.createElement('a');

 a.href=
  URL.createObjectURL(blob);

 a.download=
  'proseka_crystals.csv';

 a.click();

 URL.revokeObjectURL(
  a.href
 );

};



$('importCsv').onchange=e=>{

 const f=e.target.files[0];

 if(!f)return;

 const rd=
  new FileReader();


 rd.onload=()=>{

  const lines=
   String(rd.result)
    .replace(/^\uFEFF/,'')
    .trim()
    .split(/\r?\n/);


  const imported=[];


  for(
   let i=1;
   i<lines.length;
   i++
  ){

   const [
    date,
    cr
   ]=
    lines[i].split(',');


   if(
    /^\d{4}-\d{2}-\d{2}$/.test(date)&&
    Number.isFinite(Number(cr))
   ){

    imported.push({
     date:date,
     crystals:Number(cr)
    });

   }

  }


  if(imported.length){

   data.records=
    imported;

   save();

   update();

   alert(
    imported.length+
    '件読み込みました。'
   );

  }else{

   alert(
    '読み込める記録がありません。'
   );

  }

 };


 rd.readAsText(
  f,
  'utf-8'
 );

 e.target.value='';

};

$('resetAll').onclick=async()=>{

 if(!confirm(
  '本当にすべてリセットしますか？'
 ))
  return;


 localStorage.removeItem(KEY);


 data={
  targets:[
   {
    id:Date.now(),
    name:'',
    date:'',
    ceiling:90000
   }
  ],
  records:[],
  planMode:'minimum',
  maxDaily:0
 };


 try{

  const db=await openDB();

  const tx=
   db.transaction(
    'images',
    'readwrite'
   );

  tx.objectStore('images')
   .clear();

 }catch(e){}


 renderTargets();

 update();

};
