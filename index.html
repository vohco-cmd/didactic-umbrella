<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#f5f6fb;color:#222}

main{max-width:820px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:17px;margin-bottom:14px;box-shadow:0 5px 18px #30306012}
h2{font-size:17px;margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
label{font-size:12px;color:#666;display:block;margin-bottom:5px}input{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;font-size:16px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.primary{background:#6c63ff;color:#fff}.secondary{background:#eeeefa;color:#554dc6}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{background:#f6f6ff;border-radius:12px;padding:11px}.stat span{font-size:11px;color:#666}.stat b{display:block;font-size:20px;color:#5148c9;margin-top:4px}
.progress{height:13px;background:#e7e7f0;border-radius:20px;overflow:hidden;margin-top:12px}.bar{height:100%;width:0;background:#6c63ff}
canvas{width:100%;height:280px;background:#fbfbfe;border-radius:12px}.note{font-size:12px;color:#777;line-height:1.6}.targetBox,.summaryBox{border:1px solid #e6e6f2;border-radius:14px;padding:13px;margin-bottom:10px;background:#fafaff}.targetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.summaryTitle{font-size:16px;font-weight:800;color:#5148c9;margin-bottom:10px}.summaryGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.summaryGrid>div{background:#fff;border-radius:10px;padding:9px}.summaryGrid span{font-size:11px;color:#666}.summaryGrid b{display:block;font-size:15px;margin-top:3px}.planAlert{padding:10px 12px;border-radius:10px;background:#fff0f2;color:#a33;margin-bottom:10px;font-size:13px}.planGood{padding:10px 12px;border-radius:10px;background:#eefbf3;color:#267044;margin-bottom:10px;font-size:13px}.planMain{padding:12px;border-radius:12px;background:#f1f0ff;margin-bottom:10px}.planMain b{font-size:21px;color:#5148c9}.planTable{width:100%;border-collapse:collapse;font-size:12px}.planTable th,.planTable td{padding:8px 5px;border-bottom:1px solid #e8e8ef;text-align:left}.planTable th{color:#666;font-weight:700}.planNum{text-align:right!important;white-space:nowrap}@media(max-width:650px){
.summaryGrid{grid-template-columns:1fr 1fr}
.planTable{font-size:12px;display:block;width:100%;}
.planTable thead{display:none}
.planTable tbody,.planTable tr,.planTable td{display:block;width:100%;}
.planTable tr{border-bottom:1px solid #e8e8ef;padding:10px 0;}
.planTable td{padding:5px 4px;border:0;text-align:left!important;white-space:normal;overflow-wrap:anywhere;word-break:break-word;}
.planTable td::before{content:attr(data-label);display:inline-block;min-width:8em;margin-right:8px;color:#666;font-weight:700;}
.planTable td.planNum{text-align:left!important;white-space:normal;}
.planTable td.planNum::before{min-width:8em;}
}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 5px;border-bottom:1px solid #eee;text-align:left}
@media(max-width:650px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}

</head>
<body>
<header>
  <h1>🎟️ プロセカ ガチャ禁管理</h1>
  <div class="sub">欲しいカードが来るまでクリスタルを貯めよう</div>

</header>

<main>
<section class="card">
<h2>① 欲しいカードの目標設定</h2>
<div id="targets"></div>
<div class="actions"><button class="btn primary" id="addTarget">＋ 欲しいカードを追加</button></div>
<p class="note">カードごとに実装日・天井まで必要なクリスタル・必要な1日あたり獲得量を個別に管理できます。</p>
</section>

<section class="card">
<h2>② 欲しいカード別の必要量</h2>
<div id="targetSummary"></div>
</section>

<section class="card">
<h2>③ 全ての欲しいカードを取るための計画</h2>
<div class="grid" style="margin-bottom:12px"><div><label>計算方法</label><select id="planMode"><option value="zero">カード取得時に残り0にする</option><option value="minimum">🟣 全カードを考慮して1日あたり必要量を最小にする（余りを次へ繰越）</option><option value="constant">全ての日で同じ獲得量にして間に合わせる</option></select></div><div><label>最高1日クリスタル獲得量</label><input id="maxDaily" type="number" min="0" placeholder="例：1000"></div></div>
<div id="allTargetPlan"></div>
<p class="note">🟣 最小モードは、カードごとに残高を0へ戻して計算しません。早いカードの取得後に余ったクリスタルを次のカードへ繰り越し、全カードをまとめて考えた「1日あたり最大必要量」を最小化します。</p>
</section>

<section class="card">
<h2>④ クリスタル推移</h2>
<canvas id="chart" width="760" height="280"></canvas>
<p class="note">実線＝所持クリスタル、点線＝天井ライン。</p>
</section>

<section class="card">
<h2>⑤ 記録</h2>
<div class="grid"><div><label>記録する日付</label><input id="recordDate" type="date"></div><div><label>その日の所持クリスタル</label><input id="current" type="number" min="0" value="0"></div></div>
<div class="actions" style="margin-top:0"><button class="btn primary" id="record">この日付の記録を保存</button><button class="btn secondary" id="cancelEdit" style="display:none">編集をキャンセル</button><button class="btn secondary" id="csvOut">CSVを書き出す</button><button class="btn secondary" id="csvInBtn">CSVを読み込む</button><input id="csvIn" type="file" accept=".csv" style="display:none"><button class="btn" id="clear" style="background:#ffe8eb;color:#b33">全削除</button></div>
<div style="overflow:auto;margin-top:10px"><table><thead><tr><th>日付</th><th>クリスタル</th><th>前日比</th><th></th></tr></thead><tbody id="records"></tbody></table></div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
let settings=JSON.parse(localStorage.getItem("pk_settings_v2")||"{}");
let records=JSON.parse(localStorage.getItem("pk_records_v2")||"[]");
let targets=JSON.parse(localStorage.getItem("pk_targets_v1")||"[]");
if(!targets.length && settings.cardName){targets=[{id:Date.now(),name:settings.cardName,date:settings.targetDate||"",ceiling:Number(settings.ceiling||90000)}]}

function save(){localStorage.setItem("pk_settings_v2",JSON.stringify(settings));localStorage.setItem("pk_records_v2",JSON.stringify(records));localStorage.setItem("pk_targets_v1",JSON.stringify(targets))}
function fmt(n){return Number(n||0).toLocaleString("ja-JP")}
function daysUntil(s){if(!s)return null;let a=new Date();a.setHours(0,0,0,0);return Math.ceil((new Date(s+"T00:00:00")-a)/86400000)}

function openPhotoDB(){
  return new Promise((resolve,reject)=>{
    const r=indexedDB.open("ProsekaGachaDB",1);
    r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("images"))r.result.createObjectStore("images")};
    r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);
  });
}
async function getTargetPhotos(targetId){
  const db=await openPhotoDB();
  return new Promise((resolve,reject)=>{
    const r=db.transaction("images","readonly").objectStore("images").getAllKeys();
    r.onsuccess=async()=>{
      const keys=(r.result||[]).filter(k=>String(k).startsWith("target_"+targetId+"_"));
      const store=db.transaction("images","readonly").objectStore("images");
      const out=[];
      for(const key of keys){
        const item=await new Promise((res,rej)=>{const q=store.get(key);q.onsuccess=()=>res({key,blob:q.result});q.onerror=()=>rej(q.error)});
        if(item.blob) out.push(item);
      }
      resolve(out);
    };
    r.onerror=()=>reject(r.error);
  });
}
async function saveTargetPhotos(targetId,files){
  const db=await openPhotoDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction("images","readwrite"),store=tx.objectStore("images");
    files.forEach((f,i)=>store.put(f,"target_"+targetId+"_"+Date.now()+"_"+i));
    tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
  });
}
async function deleteTargetPhoto(key){
  const db=await openPhotoDB();
  return new Promise((resolve,reject)=>{const tx=db.transaction("images","readwrite");tx.objectStore("images").delete(key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});
}
async function deleteTargetPhotos(targetId){
  const db=await openPhotoDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction("images","readwrite"),store=tx.objectStore("images"),q=store.getAllKeys();
    q.onsuccess=()=>{(q.result||[]).filter(k=>String(k).startsWith("target_"+targetId+"_")).forEach(k=>store.delete(k))};
    tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
  });
}
async function deleteAllPhotos(){
  const db=await openPhotoDB();
  return new Promise((resolve,reject)=>{const tx=db.transaction("images","readwrite");tx.objectStore("images").clear();tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});
}

async function renderTargets(){
  const box=$("targets");box.innerHTML="";
  targets.forEach((t,i)=>{
    const el=document.createElement("div");el.className="targetBox";
    el.innerHTML=`<div class="targetHead"><b>目標 ${i+1}</b><button class="btn secondary removeTarget" type="button">削除</button></div>
      <div class="grid"><div><label>欲しいカード名</label><input class="tName" value="${esc(t.name||"")}" placeholder="例：○○の限定★4"></div>
      <div><label>実装予定日</label><input class="tDate" type="date" value="${t.date||""}"></div>
      <div><label>天井まで必要なクリスタル</label><input class="tCeil" type="number" min="0" value="${Number(t.ceiling||0)}"></div></div>
      <div class="targetPhotos"><label>このカードの写真</label><div class="targetPhotoGallery"></div>
        <div class="photoBtns"><label class="btn photoBtn">📷 写真を追加<input class="targetPhotoInput" type="file" accept="image/*" multiple style="display:none"></label>
        <button class="btn secondary removeTargetPhotos" type="button">写真を全部削除</button></div>
        <div class="note">このカード専用。最大10枚まで保存できます。</div></div>`;
    el.querySelector(".removeTarget").onclick=async()=>{await deleteTargetPhotos(t.id);targets.splice(i,1);save();await renderTargets();update()};
    [".tName",".tDate",".tCeil"].forEach(sel=>el.querySelector(sel).addEventListener("input",()=>{
      t.name=el.querySelector(".tName").value;t.date=el.querySelector(".tDate").value;t.ceiling=Number(el.querySelector(".tCeil").value||0);save();update();
    }));
    const gallery=el.querySelector(".targetPhotoGallery");
    const renderCardPhotos=async()=>{
      gallery.innerHTML="";
      try{
        const items=await getTargetPhotos(t.id);
        items.forEach((item,n)=>{
          const wrap=document.createElement("div");wrap.className="photoItem";
          const img=document.createElement("img");img.alt=(t.name||"このカード")+" 写真 "+(n+1);const url=URL.createObjectURL(item.blob);img.src=url;
          wrap.append(img);gallery.appendChild(wrap);
        });
      }catch(e){gallery.innerHTML='<div class="note">写真を表示できませんでした</div>'}
    };
    el.querySelector(".targetPhotoInput").addEventListener("change",async e=>{
      const files=[...(e.target.files||[])].filter(f=>f.type.startsWith("image/"));
      if(!files.length){e.target.value="";return}
      try{
        const existing=await getTargetPhotos(t.id),add=files.slice(0,Math.max(0,10-existing.length));
        if(!add.length){alert("このカードの写真は最大10枚までです");e.target.value="";return}
        if(files.length>add.length)alert("このカードの写真は最大10枚までです。追加できる分だけ保存しました。");
        await saveTargetPhotos(t.id,add);await renderCardPhotos();
      }catch(err){alert("写真の保存に失敗しました。別の画像で試してください。")}
      e.target.value="";
    });
    el.querySelector(".removeTargetPhotos").onclick=async()=>{if(confirm("このカードの写真を全部削除しますか？")){await deleteTargetPhotos(t.id);await renderCardPhotos()}};
    box.appendChild(el);renderCardPhotos();
  });
}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateDiffFromToday(s){
  if(!s)return null;
  const now=new Date();now.setHours(0,0,0,0);
  const d=new Date(s+"T00:00:00");
  return Math.ceil((d-now)/86400000);
}
function verifyPlan(rows, rate, initial, maxDaily, mode){
  // 計算結果を表示する前に、各カード到達時の必要量と上限を独立に再計算して検算する。
  if(!rows.length || !Number.isFinite(rate) || rate < 0) return {ok:false,reason:'必要獲得量を正しく計算できませんでした。'};
  if(maxDaily>0 && rate>maxDaily) return {ok:false,reason:'最高1日獲得量の上限を超えています。'};
  for(const r of rows){
    const available=initial+rate*r.days-r.cumulative;
    if(available < -1e-9) return {ok:false,reason:'「'+(r.t.name||'名前未設定')+'」までに必要量が不足しています。'};
  }
  if(mode==='minimum' && rate>0){
    const lower=rate-1;
    const lowerFails=rows.some(r=>initial+lower*r.days-r.cumulative < -1e-9);
    if(!lowerFails) return {ok:false,reason:'最小必要量の検算に失敗しました。'};
  }
  return {ok:true};
}
function renderConstantPlan(list, cur, today, maxDaily){
  const initial=Math.max(0,Number(cur||0));
  let cumulative=0;
  const rows=[];
  let totalDays=0;
  let previous=today;
  for(const t of list){
    const date=new Date(t.date+"T00:00:00");
    const days=Math.max(0,Math.ceil((date-previous)/86400000));
    const ceil=Math.max(0,Number(t.ceiling||0));
    cumulative+=ceil;
    totalDays+=days;
    rows.push({t,date,days,ceil,cumulative});
    previous=date;
  }
  // 1日ごとの獲得量を全期間で完全に同じにし、各締切に間に合う最小の整数を求める。
  let required=0;
  let elapsed=0;
  for(const r of rows){
    elapsed+=r.days;
    const deficit=Math.max(0,r.cumulative-initial);
    const need=elapsed>0?deficit/elapsed:(deficit>0?Infinity:0);
    if(need>required) required=need;
  }
  const rate=Math.ceil(required);
  const balances=rows.map(r=>{
    const available=initial+rate*(Math.max(0,Math.ceil((r.date-today)/86400000)));
    return Math.max(0,available-r.cumulative);
  });
  rows.forEach((r,i)=>r.balance=balances[i]);

  const verification=verifyConstantPlan(rows,rate,initial,maxDaily);
  if(!verification.ok){
    return '<div class="planAlert">⚠️ 計算結果の検算で不一致が見つかったため、結果を確定できません。'+esc(verification.reason||'')+'</div>';
  }
  const impossible=maxDaily>0 && rate>maxDaily;
  let html='';
  if(impossible){
    html+='<div class="planAlert">⚠️ 全期間を同じ <b>'+fmt(rate)+'個/日</b> で貯める必要がありますが、設定した上限 <b>'+fmt(maxDaily)+'個/日</b> を超えています。</div>';
  }else{
    html+='<div class="planGood">✅ 検算OK：毎日同じ <b>'+fmt(rate)+'個/日</b> を獲得すれば、各カードの実装日に間に合います。</div>';
  }
  html+='<div class="planMain">毎日同じにする必要獲得量/日<br><b>'+fmt(rate)+'個/日</b>'+(maxDaily>0?' <span class="note">（上限：'+fmt(maxDaily)+'個/日）</span>':'')+'</div>';
  html+='<div class="note" style="margin-bottom:10px">毎日同じ獲得量で計算し、カード取得後の余りは次のカードへ持ち越します。このモードでは最後のカード取得後も余りが残る場合があります。</div>';
  html+='<table class="planTable"><thead><tr><th>カード</th><th>実装日</th><th class="planNum">ここまでの累計使用</th><th class="planNum">毎日同じ必要/日</th><th class="planNum">取得後の残り</th></tr></thead><tbody>';
  rows.forEach(r=>{
    const balance=r.balance;
    html+='<tr><td data-label="カード">'+esc(r.t.name||'名前未設定')+'</td><td data-label="実装日">'+r.t.date+'</td><td data-label="ここまでの累計使用" class="planNum">'+fmt(r.cumulative)+'個</td><td data-label="毎日同じ必要/日" class="planNum">'+fmt(rate)+'個/日'+(maxDaily>0&&rate>maxDaily?' <span style="color:#b33">(上限超過)</span>':'')+'</td><td data-label="取得後の残り" class="planNum">'+fmt(balance)+'個</td></tr>';
  });
  html+='</tbody></table>';
  return html;
}
function verifyConstantPlan(rows, rate, initial, maxDaily){
  if(!rows.length || !Number.isFinite(rate) || rate<0) return {ok:false,reason:'一定獲得量を正しく計算できませんでした。'};
  if(maxDaily>0 && rate>maxDaily) return {ok:false,reason:'最高1日獲得量の上限を超えています。'};
  for(const r of rows){
    const elapsed=Math.max(0,Math.ceil((r.date-new Date(new Date().setHours(0,0,0,0)))/86400000));
    if(initial+rate*elapsed+1e-9<r.cumulative) return {ok:false,reason:'「'+(r.t.name||'名前未設定')+'」までに必要量が不足しています。'};
  }
  if(rate>0){
    const lower=rate-1;
    const lowerFails=rows.some(r=>{
      const elapsed=Math.max(0,Math.ceil((r.date-new Date(new Date().setHours(0,0,0,0)))/86400000));
      return initial+lower*elapsed+1e-9<r.cumulative;
    });
    if(!lowerFails) return {ok:false,reason:'一定獲得量の最小値検算に失敗しました。'};
  }
  return {ok:true};
}
function buildGlobalDeadlineRows(list,initial,today){
  let cumulative=0;
  const rows=[];
  for(const t of list){
    const date=new Date(t.date+"T00:00:00");
    const days=Math.max(0,Math.ceil((date-today)/86400000));
    const ceil=Math.max(0,Number(t.ceiling||0));
    cumulative+=ceil;
    const deficit=Math.max(0,cumulative-initial);
    const rawRequired=days>0?deficit/days:(deficit>0?Infinity:0);
    rows.push({t,date,days,cumulative,ceil,deficit,rawRequired});
  }
  return rows;
}

function isGlobalDailyCapFeasible(rows,initial,rate){
  if(!rows.length || !Number.isFinite(rate) || rate<0)return false;
  for(const r of rows){
    // 「今日までに必要な累計使用量」を、現在残高＋rate×今日からの日数で賄えるか。
    if(initial + rate*r.days + 1e-9 < r.cumulative)return false;
  }
  return true;
}

function findGlobalMinimumDailyCap(rows,initial){
  if(!rows.length)return 0;
  if(!isGlobalDailyCapFeasible(rows,initial,0)){
    let high=1;
    while(high<1000000000 && !isGlobalDailyCapFeasible(rows,initial,high))high*=2;
    if(!isGlobalDailyCapFeasible(rows,initial,high))return Infinity;
    let low=0;
    while(low+1<high){
      const mid=Math.floor((low+high)/2);
      if(isGlobalDailyCapFeasible(rows,initial,mid))high=mid;
      else low=mid;
    }
    return high;
  }
  return 0;
}

function simulateGlobalMinimumPlan(list,initial,today,rate){
  let balance=initial;
  let previous=today;
  return list.map(t=>{
    const date=new Date(t.date+"T00:00:00");
    const days=Math.max(0,Math.ceil((date-previous)/86400000));
    const earned=rate*days;
    const before=balance+earned;
    const ceil=Math.max(0,Number(t.ceiling||0));
    const after=before-ceil;
    const row={t,date,days,earned,before,ceil,after:Math.max(0,after)};
    balance=Math.max(0,after);
    previous=date;
    return row;
  });
}

function verifyGlobalMinimum(rows,initial,rate,maxDaily){
  if(!Number.isFinite(rate)||rate<0)return {ok:false,reason:'必要量が有限の数として求まりません。'};
  if(maxDaily>0 && rate>maxDaily)return {ok:true,reason:'計算自体は成立するが、設定上限を超えています。'};
  if(!isGlobalDailyCapFeasible(rows,initial,rate))return {ok:false,reason:'この日量では締切に間に合いません。'};
  if(rate>0 && isGlobalDailyCapFeasible(rows,initial,rate-1))return {ok:false,reason:'さらに1個/日少なくできてしまいます。'};
  return {ok:true};
}

function renderAllTargetPlan(cur){
  const box=$("allTargetPlan");
  const list=targets.filter(t=>t.date && Number(t.ceiling||0)>0).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const maxDaily=Math.max(0,Number(settings.maxDaily||0));
  const mode=settings.planMode||"zero";
  if(!list.length){box.innerHTML='<div class="note">実装日と天井クリスタルを設定すると、全カードを取るための連続計画が表示されます。</div>';return;}
  const today=new Date();today.setHours(0,0,0,0);
  const initial=Math.max(0,Number(cur||0));
  let html='';

  if(mode==="constant"){
    box.innerHTML=renderConstantPlan(list,cur,today,maxDaily);
    return;
  }
  if(mode==="minimum"){
    /*
      ★ 最小モードの本体
      「各カードを0にする」計算ではない。
      全カードを期限までに取るための「1日あたり最大必要量」の最小値をまず求め、
      その最大値を超えない範囲で、各区間では未来も考えた「必要最低限」だけ貯める。

      例：
      現在20,000 / 40日後60,000 / 80日後120,000
      → 1,000/日で1枚目だけを見るのではなく、2枚目まで含めて計算
      → 最小最大日量は2,000/日
      → 1枚目取得時には40,000残り、それを2枚目へ持ち越す。
    */

    const globalRows=buildGlobalDeadlineRows(list,initial,today);
    const optimal=findGlobalMinimumDailyCap(globalRows,initial);

    if(!Number.isFinite(optimal)){
      box.innerHTML='<div class="planAlert">⚠️ 現在のクリスタルでは、今日までの条件を含めて全カードを期限内に取ることができません。</div>'
        +'<div class="planMain">全体最適化された必要量/日<br><b>計算不能</b></div>';
      return;
    }

    const planRows=simulateGlobalMinimumPlan(list,initial,today,optimal);

    /*
      ここが重要。
      optimal を上限として、各カード取得後に「未来のカードを間に合わせるため
      最低限必要な残高」を逆算する。
      その残高を確保するために今区間で何個/日必要かを求める。
      これにより「カード1で少し余計に貯めて、カード2の負担を減らす」ができる。
    */
    let cumulative=0;
    const cumulativeRows=[];
    for(let i=0;i<list.length;i++){
      const t=list[i];
      const date=new Date(t.date+"T00:00:00");
      const days=Math.max(0,Math.ceil((date-today)/86400000));
      const ceil=Math.max(0,Number(t.ceiling||0));
      cumulative+=ceil;
      cumulativeRows.push({t,date,days,ceil,cumulative});
    }

    // 各カードを取得した「直後」に、未来のカードのために最低限いくら残せばいいか。
    const reserveAfter=[];
    for(let i=0;i<cumulativeRows.length;i++){
      let reserve=0;
      for(let j=i+1;j<cumulativeRows.length;j++){
        const future=cumulativeRows[j];
        const now=cumulativeRows[i];
        const futureSpend=future.cumulative-now.cumulative;
        const futureDays=Math.max(0,future.days-now.days);
        const requiredAtNow=futureSpend-optimal*futureDays;
        if(requiredAtNow>reserve)reserve=requiredAtNow;
      }
      reserveAfter[i]=Math.max(0,Math.ceil(reserve));
    }

    let balance=initial;
    let previousDate=today;
    const detailed=[];
    let calculationOK=true;

    for(let i=0;i<cumulativeRows.length;i++){
      const r=cumulativeRows[i];
      const days=Math.max(0,Math.ceil((r.date-previousDate)/86400000));
      const neededAfterPurchase=reserveAfter[i];
      const neededBeforePurchase=r.ceil+neededAfterPurchase;
      const earnNeeded=Math.max(0,neededBeforePurchase-balance);
      const rate=days>0?Math.ceil(earnNeeded/days):(earnNeeded>0?Infinity:0);

      if(!Number.isFinite(rate) || rate>optimal)calculationOK=false;

      const earned=Number.isFinite(rate)?rate*days:0;
      const before=balance+earned;
      const after=before-r.ceil;

      detailed.push({
        t:r.t,
        date:r.date,
        days,
        startBalance:balance,
        earned,
        requiredBefore:neededBeforePurchase,
        before,
        ceil:r.ceil,
        after:Math.max(0,after),
        futureReserve:neededAfterPurchase,
        rate
      });

      balance=Math.max(0,after);
      previousDate=r.date;
    }

    // 実際の最終結果を厳密に検算。
    // 各区間で使っている日量の最大値が optimal 以下で、全カード取得前に天井額を確保できればOK。
    const actualMax=detailed.reduce((m,r)=>Math.max(m,Number.isFinite(r.rate)?r.rate:Infinity),0);
    const allReached=detailed.every(r=>r.before>=r.ceil-1e-9);
    const maxOK=actualMax<=optimal;
    const lowerFeasible=isGlobalDailyCapFeasible(globalRows,initial,Math.max(0,optimal-1));
    const minimalOK=!lowerFeasible;
    const upperOK=maxDaily<=0 || optimal<=maxDaily;

    if(!allReached || !maxOK || !minimalOK)calculationOK=false;

    if(!upperOK){
      html+='<div class="planAlert">⚠️ 全カードを取るための全体最小値は <b>'+fmt(optimal)+'個/日</b> です。設定した上限 <b>'+fmt(maxDaily)+'個/日</b> では足りません。</div>';
    }else if(calculationOK){
      html+='<div class="planGood">✅ 全体最適化OK：カード①の余りをカード②以降へ持ち越し、1日あたりの最大必要量を <b>'+fmt(optimal)+'個/日</b> まで下げています。</div>';
    }else{
      html+='<div class="planAlert">⚠️ 計算結果の検算に失敗しました。条件を確認してください。</div>';
    }

    const bottleneck=globalRows.slice().sort((a,b)=>b.rawRequired-a.rawRequired)[0];
    html+='<div class="planMain">全カードを考慮した最小の「1日あたり最大必要量」<br><b>'+fmt(optimal)+'個/日</b>'
      +(maxDaily>0?' <span class="note">（設定上限：'+fmt(maxDaily)+'個/日）</span>':'')
      +(bottleneck?' <span class="note">（最も厳しい締切：'+esc(bottleneck.t.name||'名前未設定')+'）</span>':'')
      +'</div>';

    html+='<div class="note" style="margin-bottom:10px"><b>この計算ではカードごとに残高を0にしません。</b> 早いカードの時点で余分に持っておくことで、後のカードで必要な1日あたり獲得量を下げます。途中の余りは自動的に次のカードへ繰り越されます。</div>';

    html+='<table class="planTable"><thead><tr>'
      +'<th>カード</th><th>実装日</th><th class="planNum">この区間の日数</th><th class="planNum">この区間の必要/日</th><th class="planNum">開始残高</th><th class="planNum">この区間の獲得</th><th class="planNum">取得前</th><th class="planNum">取得後の残り</th>'
      +'</tr></thead><tbody>';

    detailed.forEach((r,i)=>{
      const rateText=Number.isFinite(r.rate)?fmt(r.rate)+'個/日':'間に合わない';
      html+='<tr>'
        +'<td data-label="カード">'+esc(r.t.name||'名前未設定')+'</td>'
        +'<td data-label="実装日">'+r.t.date+'</td>'
        +'<td data-label="この区間の日数" class="planNum">'+fmt(r.days)+'日</td>'
        +'<td data-label="この区間の必要/日" class="planNum"><b>'+rateText+'</b></td>'
        +'<td data-label="開始残高" class="planNum">'+fmt(r.startBalance)+'個</td>'
        +'<td data-label="この区間の獲得" class="planNum">+'+fmt(r.earned)+'個</td>'
        +'<td data-label="取得前" class="planNum">'+fmt(r.before)+'個</td>'
        +'<td data-label="取得後の残り" class="planNum"><b>'+fmt(r.after)+'個</b>'
        +(r.futureReserve>0?' <span class="note">（次以降に最低'+fmt(r.futureReserve)+'個必要）</span>':'')
        +'</td>'
        +'</tr>';
    });
    html+='</tbody></table>';

    if(upperOK){
      html+='<div class="planGood">🎯 この表の「この区間の必要/日」が実際の貯め方です。区間ごとに数字は変わってよく、<b>最大でも '+fmt(optimal)+'個/日</b> です。</div>';
    }
    box.innerHTML=html;
    return;
  }else{
    // 0モード：各カード取得時に天井分を使い切り、取得後0個にする。
    let balance=initial, prevDate=today, maxRequired=0, bottleneck=null, impossible=false, cumulative=0;
    const rows=[];
    list.forEach(t=>{
      const date=new Date(t.date+"T00:00:00");
      const days=Math.max(0,Math.ceil((date-prevDate)/86400000));
      const ceil=Math.max(0,Number(t.ceiling||0));
      cumulative+=ceil;
      const shortage=Math.max(0,ceil-balance);
      const rawRequired=days>0?shortage/days:(shortage>0?Infinity:0);
      if(rawRequired>maxRequired){maxRequired=rawRequired;bottleneck=t;}
      const rate=Math.ceil(rawRequired);
      const possible=Number.isFinite(rawRequired) && (maxDaily<=0 || rate<=maxDaily);
      if(!possible) impossible=true;
      balance=0;
      rows.push({t,days,ceil,cumulative,rawRequired,plannedRate:rate,balance,possible});
      prevDate=date;
    });
    const requiredCeil=Math.ceil(maxRequired);
    // 0モードの検算は、各カード間を「取得後0個」から独立に再計算する。
    let zeroVerifyOk=true;
    let checkDate=today;
    let checkBalance=initial;
    for(const r of rows){
      const gain=requiredCeil*r.days;
      if(checkBalance+gain+1e-9 < r.ceil){ zeroVerifyOk=false; break; }
      checkBalance=0;
      checkDate=r.t;
    }
    if(requiredCeil>0){
      const lower=requiredCeil-1;
      let lowerFails=false, lb=initial;
      for(const r of rows){
        if(lb+lower*r.days+1e-9 < r.ceil){ lowerFails=true; break; }
        lb=0;
      }
      if(!lowerFails) zeroVerifyOk=false;
    }
    const verification={ok:zeroVerifyOk};
    impossible=impossible || !verification.ok;
    if(maxDaily<=0){
      html+='<div class="note" style="margin-bottom:10px">最高獲得量を入力すると、その上限を超えない範囲で「間に合うか」を判定します。</div>';
    }else if(impossible){
      html+='<div class="planAlert">⚠️ 最高でも <b>'+fmt(maxDaily)+'個/日</b> なので、現在の条件では全カードに間に合わない区間があります。</div>';
    }else{
      html+='<div class="planGood">✅ 検算OK：必要獲得量を確認し、最高 <b>'+fmt(maxDaily)+'個/日</b> の範囲で全カードに間に合います。</div>';
    }
    html+='<div class="planMain">全カードを間に合わせるための必要獲得量/日<br><b>'+fmt(requiredCeil)+'個/日</b>'+(maxDaily>0?' <span class="note">（上限：'+fmt(maxDaily)+'個/日）</span>':'')+(bottleneck?' <span class="note">（最も厳しい区間：'+esc(bottleneck.name||'名前未設定')+'）</span>':'')+'</div>';
    html+='<div class="note" style="margin-bottom:10px">検算：各カードを取得する直前までに天井分を確保できるかを再計算しています。取得後は0個になります。</div>';
    html+='<table class="planTable"><thead><tr><th>カード</th><th>実装日</th><th class="planNum">ここまでの累計使用</th><th class="planNum">必要/日</th><th class="planNum">取得後の残り</th></tr></thead><tbody>';
    rows.forEach(r=>{
      const rate=r.rawRequired;
      const rateText=r.possible?(rate===Infinity?'間に合わない':fmt(Math.ceil(rate))+'個/日'):'<span style="color:#b33;font-weight:700">'+(rate===Infinity?'間に合わない':fmt(Math.ceil(rate))+'個/日')+'</span>';
      html+='<tr><td data-label="カード">'+esc(r.t.name||'名前未設定')+'</td><td data-label="実装日">'+r.t.date+'</td><td data-label="ここまでの累計使用" class="planNum">'+fmt(r.cumulative)+'個</td><td data-label="必要/日" class="planNum">'+rateText+(maxDaily>0&&rate>maxDaily?' <span style="color:#b33">(上限超過)</span>':'')+'</td><td data-label="取得後の残り" class="planNum">0個</td></tr>';
    });
    html+='</tbody></table>';
  }
  box.innerHTML=html;
}
function update(){
  const maxDailyEl=$("maxDaily");
  if(maxDailyEl) maxDailyEl.value=settings.maxDaily?settings.maxDaily:"";
  const planModeEl=$("planMode");
  if(planModeEl) planModeEl.value=settings.planMode||"zero";
  const sortedRecords=records.slice().filter(r=>r && r.date && Number.isFinite(Number(r.crystals))).sort((a,b)=>a.date.localeCompare(b.date));
  const cur=sortedRecords.length?Number(sortedRecords[sortedRecords.length-1].crystals):Number(settings.current||0);
  let daily=null;
  // 「現在の獲得ペース」は、最初の記録から最新の記録までの累計平均で計算する。
  // （最新の所持数 − 最初の所持数）÷ 経過日数
  if(sortedRecords.length>=2){
    const first=sortedRecords[0],last=sortedRecords[sortedRecords.length-1];
    const span=(new Date(last.date)-new Date(first.date))/86400000;
    if(Number.isFinite(span) && span>0) daily=(Number(last.crystals)-Number(first.crystals))/span;
  }
  const summary=$("targetSummary");summary.innerHTML="";
  targets.forEach((t,i)=>{
    const d=daysUntil(t.date),remain=Math.max(0,Number(t.ceiling||0)-cur),needed=d!==null&&d>0?remain/d:null;
    const rate=t.ceiling?Math.min(100,cur/t.ceiling*100):0;
    const card=document.createElement("div");card.className="summaryBox";
    card.innerHTML=`<div class="summaryTitle">🎯 ${esc(t.name||"名前未設定")}</div>
      <div class="summaryGrid"><div><span>実装日</span><b>${t.date||"未設定"}</b></div><div><span>実装まで</span><b>${d===null?"--":d<0?"実装済み":d+"日"}</b></div>
      <div><span>天井まで必要</span><b>${fmt(remain)}個</b></div><div><span>必要獲得量/日</span><b>${needed===null?"--":fmt(Math.ceil(Math.max(0,needed)))+"個/日"}</b></div>
      <div><span>現在の達成率</span><b>${rate.toFixed(1)}%</b></div><div><span>現在の獲得ペース</span><b>${daily===null?"--":(daily>=0?"+":"")+fmt(Math.round(daily))+"個/日"}</b></div></div>
      <div class="progress"><div class="bar" style="width:${rate}%"></div></div>`;
    summary.appendChild(card);
  });
  renderAllTargetPlan(cur);
  renderTable();drawChart(Math.max(0,...targets.map(t=>Number(t.ceiling||0))));
}
$("maxDaily").addEventListener("input",e=>{settings.maxDaily=Math.max(0,Number(e.target.value||0));save();update()});
$("planMode").addEventListener("change",e=>{settings.planMode=e.target.value;save();update()});
$("addTarget").onclick=()=>{targets.push({id:Date.now()+Math.random(),name:"",date:"",ceiling:90000});save();renderTargets();update()};

function renderTable(){
  const tb=$("records");tb.innerHTML="";
  records.slice().reverse().forEach((r,j)=>{
    const i=records.length-1-j,prev=i?records[i-1].crystals:null;
    const tr=document.createElement("tr");
    tr.innerHTML="<td>"+r.date+"</td><td>"+fmt(r.crystals)+"</td><td>"+(prev===null?"—":(r.crystals-prev>=0?"+":"")+fmt(r.crystals-prev))+"</td><td><div class='actions' style='margin:0;gap:6px'><button class='btn' style='padding:5px 8px' onclick='editRecord("+i+")'>編集</button><button class='btn' style='padding:5px 8px;background:#ffe8eb;color:#b33' onclick='del("+i+")'>削除</button></div></td>";
    tb.appendChild(tr);
  });
}
window.editRecord=i=>{const r=records[i]; if(!r)return; $("recordDate").value=r.date; $("current").value=r.crystals; editingIndex=i; $("record").textContent="この記録を更新"; $("cancelEdit").style.display="inline-flex"; $("recordDate").focus();};
let editingIndex=null;
window.del=i=>{records.splice(i,1);if(editingIndex===i){editingIndex=null;$("record").textContent="この日付の記録を保存";$("cancelEdit").style.display="none";}else if(editingIndex!==null && i<editingIndex) editingIndex--;save();update()};
function drawChart(ceil){
  const c=$("chart"),ctx=c.getContext("2d"),W=c.width,H=c.height,p={l:48,r:12,t:15,b:32};
  ctx.clearRect(0,0,W,H);let max=Math.max(ceil||0,...records.map(r=>r.crystals),1);
  ctx.strokeStyle="#e6e6ee";ctx.lineWidth=1;
  for(let i=0;i<=4;i++){let y=p.t+(H-p.t-p.b)*i/4;ctx.beginPath();ctx.moveTo(p.l,y);ctx.lineTo(W-p.r,y);ctx.stroke();ctx.fillStyle="#777";ctx.font="11px sans-serif";ctx.fillText(fmt(Math.round(max*(4-i)/4)),4,y+4)}
  if(!records.length){ctx.fillStyle="#999";ctx.font="14px sans-serif";ctx.fillText("今日の所持数を記録するとグラフが始まります",W/2-170,H/2);return}
  const x=i=>records.length===1?(W+p.l-p.r)/2:p.l+(W-p.l-p.r)*i/(records.length-1),y=v=>H-p.b-(H-p.t-p.b)*v/max;
  if(ceil){ctx.setLineDash([6,5]);ctx.strokeStyle="#aaa";ctx.beginPath();ctx.moveTo(p.l,y(ceil));ctx.lineTo(W-p.r,y(ceil));ctx.stroke();ctx.setLineDash([])}
  ctx.strokeStyle="#6c63ff";ctx.lineWidth=3;ctx.beginPath();records.forEach((r,i)=>i?ctx.lineTo(x(i),y(r.crystals)):ctx.moveTo(x(i),y(r.crystals)));ctx.stroke();
  records.forEach((r,i)=>{ctx.fillStyle="#6c63ff";ctx.beginPath();ctx.arc(x(i),y(r.crystals),4,0,Math.PI*2);ctx.fill()});
}
$("record").onclick=()=>{
  const date=$("recordDate").value;
  const crystals=Number($("current").value);
  if(!date){alert("記録する日付を入力してください。");return}
  if(!Number.isFinite(crystals)||crystals<0){alert("クリスタル数を正しく入力してください。");return}
  const same=records.findIndex(r=>r.date===date);
  if(editingIndex!==null){
    if(same>=0 && same!==editingIndex){alert("その日付の記録はすでにあります。別の日付を選ぶか、既存の記録を編集してください。");return}
    records[editingIndex]={date,crystals};
  }else if(same>=0){records[same].crystals=crystals;}else{records.push({date,crystals});}
  records.sort((a,b)=>a.date.localeCompare(b.date));
  settings.current=records.length?records[records.length-1].crystals:0;
  editingIndex=null; $("record").textContent="この日付の記録を保存"; $("cancelEdit").style.display="none";
  save();update();
};
$("cancelEdit").onclick=()=>{editingIndex=null;$("record").textContent="この日付の記録を保存";$("cancelEdit").style.display="none";$("recordDate").value=new Date().toISOString().slice(0,10);$("current").value=records.length?records[records.length-1].crystals:(settings.current??0)};
$("clear").onclick=()=>{if(confirm("記録を全部削除しますか？")){records=[];save();update()}};
$("csvOut").onclick=()=>{const text="date,crystals\n"+records.map(r=>r.date+","+r.crystals).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/csv"}));a.download="proseka_gachakin.csv";a.click()};
$("csvInBtn").onclick=()=>$("csvIn").click();
$("csvIn").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{rd.result.split(/\r?\n/).slice(1).forEach(l=>{let [d,n]=l.split(",");if(d&&n&&!isNaN(Number(n)))records.push({date:d,crystals:Number(n)})});let m={};records.forEach(r=>m[r.date]=r);records=Object.values(m).sort((a,b)=>a.date.localeCompare(b.date));save();update()};rd.readAsText(f);e.target.value=""};

$("recordDate").value=new Date().toISOString().slice(0,10);
$("current").value=records.length?records[records.length-1].crystals:(settings.current??0);
renderTargets();update();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
